[project]
name = "resume-tailor"
version = "0.1.0"
description = "Tailor a resume to a job description and drive the application through a real browser"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.3.0",
    "openai>=3.0",
    "mcp>=2.0.0",
    "playwright>=1.49.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "pydantic>=2.0",
]

[project.scripts]
resume-tailor = "resume_tailor.cli:main"
resume-tailor-mcp = "resume_tailor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_tailor"]

# The deterministic answer bank for application forms. Filled once, looked up
# per form. The agent reads answers from here instead of guessing — anything
# missing gets escalated to you rather than invented.
#
# Keys are matched by the words in their names, so add keys freely: a
# `github_profile: "..."` key makes "GitHub profile" questions answerable.

work_authorization:
  default_region: "us"                 # which region an unqualified "require sponsorship?" refers to
  us_work_authorization: ""            # "Yes" / "No"
  legally_allowed_to_work_in_us: ""
  unrestricted_employment_authorization: ""   # "Yes" / "No" — the "any employer, unlimited duration" wording
  authorized_to_work_in_the_job_posting_country: ""   # "Yes" / "No" — a Yes/No, not a country name
  requires_us_visa: ""
  requires_us_sponsorship: ""
  require_sponsorship_for_employment_visa_status: ""   # the commonest wording, for a text box; option lists are decided by the sponsorship rule
  require_immigration_sponsorship: ""
  only_temporarily_authorized_to_work: ""   # "No" for a citizen or permanent resident
  citizenship_status: ""               # e.g. "U.S. citizen" / "U.S. lawful permanent resident (green card holder)"; the sponsorship rule reads it
  country_of_citizenship: ""           # the planner refuses a citizenship question that rests on nothing here
  eu_work_authorization: ""
  legally_allowed_to_work_in_eu: ""
  requires_eu_visa: ""
  requires_eu_sponsorship: ""
  uk_work_authorization: ""
  legally_allowed_to_work_in_uk: ""
  requires_uk_visa: ""
  requires_uk_sponsorship: ""
  canada_work_authorization: ""
  legally_allowed_to_work_in_canada: ""
  requires_canada_visa: ""
  requires_canada_sponsorship: ""

work_preferences:
  remote_work: ""                      # "Yes" / "No"
  hybrid_work: ""
  in_person_work: ""
  open_to_relocation: ""
  willing_to_complete_assessments: ""
  willing_to_undergo_background_checks: ""
  willing_to_undergo_drug_tests: ""

availability:
  notice_period: ""                    # e.g. "2 weeks", or "Current student — available May–August 2027"
  earliest_start_date: ""
  earliest_full_time_start_date: ""    # for the "when could you start full time?" question interns get asked
  target_term: ""
  # Answers for postings of another term, swapped in by Profile.for_term when
  # the listing's term is not summer (search.terms lists which terms to apply
  # to at all). Keys here replace the ones above for that posting only.
  by_term: {}                          # e.g. {"Winter 2027": {notice_period: "available January through April 2027", earliest_start_date: "January 2027"}}

salary_expectations:
  # Several spellings of the same answer, so "Expected salary", "Salary range"
  # and "Desired hourly rate" all find it. Leave all blank to have forms that
  # require a number skipped and logged rather than guessed.
  salary: ""
  expected_salary: ""
  salary_range_usd: ""
  desired_compensation: ""
  hourly_rate_usd: ""
  currency: ""

self_identification:
  # All voluntary. "Decline to self-identify" lands on whatever decline option
  # a form offers ("Prefer not to say", "I don't wish to answer", ...).
  gender: ""
  pronouns: ""
  veteran: ""
  disability: ""
  ethnicity: ""

# Targeting rules for the discovery half.
# The outreach lane (`resume-tailor outreach watch`, run by the supervisor):
# in-thread replies to recruiters who wrote, then notes to named recruiters
# from the address cache, then — only with fallback_team — to recruiting
# mailboxes. Weekdays 8-18 Eastern, 15 a day, 4 an hour. `enabled: false`
# (or touching ~/.resume-tailor/outreach.off) pauses sending; lookups go on.
outreach:
  enabled: true
  fallback_team: false                 # also write to careers@/recruiting@ mailboxes when no named person is known
  per_tick: 5                          # at most this many notes per 15-minute tick

# The essay writer's floor, on top of the built-in list (freetext.BANNED_DEFAULT):
# a phrase here never appears in an essay or cover letter the tool writes.
writing:
  # The dictionary of words and phrases never written into an application.
  # The floor itself (freetext.BANNED_DEFAULT, ~140 phrases with the sibling
  # kit's list folded in) is in code; this list extends it. `resume-tailor
  # words` prints the whole dictionary, `resume-tailor words --add "<phrase>"`
  # appends here. The agent driver reads it (MCP banned_words) and fill_field
  # refuses prose that breaks it. Also enforced: no em dash, never volunteer
  # a weakness.
  banned_phrases: []                   # e.g. [synergy, "I would love to", "dream job"]

search:
  positions: []                        # title words worth applying to, e.g. ["Software Engineer", "Backend", "Data Analyst"]
  locations: []
  remote: true
  hybrid: true
  onsite: true
  experience_level:
    internship: false
    entry: false
    associate: true
    mid_senior_level: true
    director: false
    executive: false
  job_types:
    internship: false
    full_time: true
    contract: false
    part_time: false
  company_blacklist: []
  title_blacklist: []
  location_blacklist: []
  host_blacklist: [linkedin.com]       # sites never opened or applied through: LinkedIn forbids automation and the account matters
  # Firms by quality. `first` are dealt before every other posting, `then`
  # after them, unlisted firms after those; `never` is not applied to at all.
  # Whole-word match on the company name. Order and floor only: eligibility
  # and the judges still decide.
  company_tiers:
    first: []                          # e.g. [Stripe, Databricks, Anthropic]
    then: []
    never: []                          # e.g. [Acme Staffing]
  apply_once_at_company: true
  # Discovery: which terms to apply for, and two safety filters. A title that
  # names another term outright ("... - Fall 2026") is left out whatever the
  # list says about it.
  terms: ["Summer 2027"]
  require_us: true
  exclude_phd_only: true
  # Companies whose applications are filled but NOT submitted until you press
  # Approve on the dashboard. Whole-word match on the company name.
  approve_before_submit: []            # e.g. [Google, Microsoft, Apple, Amazon, Meta]
  # Hosts where the tool may create an account with your e-mail and the
  # generated RESUME_TAILOR_SITE_PASSWORD. Workday needs one and does not ask
  # for e-mail confirmation; leave empty to stop at every login wall instead.
  create_accounts_on: []               # e.g. [myworkdayjobs.com]
  # Hosts whose form sits behind a captcha the tool never solves (iCIMS puts
  # an hCaptcha on its e-mail step; Tesla's careers site a bot check on its
  # form). Nothing there is opened or tailored until you have signed in once
  # by hand (dashboard → Log in); then every posting on the host is retried.
  # Host suffixes or ATS kinds, as in create_accounts_on. Omit the key for
  # the default below; an empty list turns the rule off.
  hand_lane_hosts: [icims.com, tesla.com]
  # Boards whose bot check turns a headless submit away without a word
  # (Lever's hCaptcha). The form is filled and held with an Approve button,
  # and the approved submit runs in a visible Chrome window. Same defaults
  # rule as above.
  visible_submit_hosts: [lever.co]
  # The agent driver: a Claude Code session that works postings in the
  # tool's own browser through the resume-tailor MCP server (the assist-queue
  # skill). The loop fills only the boards in loop_hosts itself and records
  # every other posting as for_agent — nothing opened, tailored or judged —
  # for the driver, from the first attempt. Host suffixes or ATS kinds, as in
  # create_accounts_on. Omit loop_hosts for the default below; an empty list
  # sends everything to the driver; agent_driver: false keeps it all in the loop.
  agent_driver: true
  loop_hosts: [greenhouse.io, ashbyhq.com, workable.com]
  # A form that carries an answer the model wrote (an essay, a cover letter)
  # is held as awaiting_approval: you read it on the dashboard and press
  # Approve, and the approved run sends exactly those words.
  approve_essays: true
  # The sibling kit's tier 4 — seed-stage, a team of a handful, no external
  # signal — is never applied to: a posting whose own words say so ("pre-seed",
  # "team of four", "founding engineer", "Team Size: 3") is skipped, in the
  # loop and by the driver, unless a funding or size signal outranks it.
  # company_tiers.never names firms outright; first/then order the rest.
  skip_tier4: true

# Facts only you know, answered once with `resume-tailor intake` BEFORE an agent
# drives anything, so a run never stops to ask "zip?", "birthday?", "college?".
# `intake --check` lists what is still missing; the agent reads the whole set
# with the MCP tool intake_facts. Keys are what form labels are matched on.
# A fact the rest of this file already holds (address.zip, personal.email…) is
# not asked again. Full list: src/resume_tailor/intake.py → FACTS.
facts: {}
#  date_of_birth: "January 1, 2005"
#  signature_name: Jane Doe
#  permanent_address_street: 1 Elm St
#  permanent_address_city: Springfield
#  permanent_address_state: IL
#  permanent_address_zip: "62704"
#  college_within_university: College of Arts and Sciences
#  high_school: Springfield High School, Springfield
#  most_recent_employer: Acme Corp
#  related_to_employees: "No"
#  offer_deadlines: "No"
#  internship_availability_dates: May 2027 – Aug 2027
#  can_start_within_3_weeks: "Yes"
#  need_housing: "Yes"
#  top_programming_languages: Python, TypeScript/JavaScript, C++
#  self_rating_programming: Extensive
#  clubs_and_organizations: ACM chapter
#  how_did_you_hear_default: Job board
#  gender: Decline
#  race_ethnicity: Decline
#  veteran_status: Decline
#  disability_status: Decline

# Answers you gave by hand while an agent finished a form the loop could not
# (the assist lane: `resume-tailor assist`, MCP assist_learn). Matched first,
# on the question's own words — the same question normalised, or a longer
# question carrying every significant word of one kept here. Written for you
# by `assist-learn`; edit or delete entries freely.
hand_answers: []
#  - question: "Do you have any recruiting timelines we should be aware of?"
#    answer: "No"
#    source: assist
#    when: 2026-10-18
  # The two match judges. One number, or {hiring manager: 85, screener: 90}.
  # A résumé under the bar is revised up to max_revisions times; with
  # apply_below_bar true it is then submitted anyway unless a named
  # eligibility rule (citizenship, clearance, degree level) is unmet.
  min_judge_score: 90
  max_revisions: 2
  apply_below_bar: false
  # jobright.ai rows link to jobright itself, which wants a sign-in before it
  # shows the employer's page; set true once the tool's browser is signed in.
  jobright_account: false
  # Résumé skeleton variants: resume/variants/<name>.yaml, each shaped like
  # resume/base.yaml. A posting gets the first variant whose words appear in
  # its title or list category (whole words, any case); none → base.yaml.
  resume_variants: {}                  # e.g. {robotics: [robot, ros, drone], ai_engineer: [ai, ml, llm]}
  # Sites to sign into by hand once with `resume-tailor setup-logins`, on top
  # of the built-in three (Google, jobright.ai, TikTok careers): a URL, or
  # {name, url, host, cookie, check} — `cookie` a regex for the cookie name
  # that marks a session, `check` a page only a signed-in visitor can see.
  hand_logins: []                      # e.g. [https://app.joinhandshake.com/login]
  # Instagram pages whose stories carry application links, read by
  # `resume-tailor instagram read|watch` in the tool's signed-in Chrome
  # (`login --site instagram.com` once). Every link sticker's address is
  # kept and joins the loop like any other listing. Slow by design: one
  # pass every couple of hours; any check from Instagram parks the page.
  instagram_pages: []                  # e.g. [ducksjobs]
  # Which lists discovery reads. A built-in left out here stays on; the
  # dashboard's Job sources card writes these two keys.
  # sources:
  #   simplify: true          # the SimplifyJobs JSON feed (the main list)
  #   jobright-swe: true
  #   jobright-ba: true
  #   speedyapply: true
  #   vanshb03: true
  # Your own README-table lists (Company | Role | Location | Link), added to
  # the built-ins: [[name, raw README url], ...]
  # extra_sources: []

# Form fields beyond the resume. School/degree/major answer themselves from
# career.yaml; the rest is here because forms ask and the resume does not say.
address:
  street: ""
  city: ""
  state: ""
  zip: ""
  country: ""
  # Optional: addresses that replace the default when the posting's location
  # matches any of their terms (whole-token for short codes like "MN").
  # alternates:
  #   - when_location_matches: ["Minnesota", "MN", "Minneapolis"]
  #     street: ""
  #     city: ""
  #     state: ""
  #     zip: ""

education:
  graduation_date: ""          # "May 2028"
  expected_graduation: ""
  graduation_year: ""
  currently_enrolled: ""       # "Yes" / "No"
  student_status: ""
  degree_level: ""             # "Bachelor's"
  graduation_month_and_year: ""   # "May 2028"

# Consent boxes and yes/no acknowledgements forms ask on the way to Submit.
consents:
  interview_recording: ""       # "Yes" / "No"
  ai_notetaking_during_interviews: ""
  text_message_updates: ""
  email_updates: ""
  data_processing: ""
  privacy_policy: ""
  terms_and_conditions: ""
  code_of_conduct: ""

# Files some forms ask for besides the résumé. A blank means: leave that
# upload empty unless the form requires it, in which case it is generated
# (cover letter, essay) or the posting is logged as needs_review.
documents:
  transcript: ""                # e.g. "~/.resume-tailor/documents/transcript.pdf"
  cover_letter: ""
  essay: ""

about:
  at_least_18_years_old: ""           # "Yes" — a bank fact, so no form ever gets a guess at your age
  18_or_older: ""
  name_pronunciation: ""        # a short phonetic guide, e.g. "soo-lay-MAHN"
  preferred_contact_method: ""  # "Email"
  applied_here_before: ""       # "No"
  outstanding_offers: ""        # "No"
  recent_reading: ""            # for "what have you read lately?" — one or two sentences, real
  university_email: ""          # only for fields that ask for a school e-mail

# Questions that stop applications when the bank is silent, each with one
# honest answer for most students. The tool matches on the key's words.
licenses:
  finra_licenses: "No"
  securities_industry_essentials_sie_exam: "No — not taken and not planned"
  real_estate_or_broker_license: "No"
  professional_licenses_or_certifications: "None"
employment_obligations:
  post_employment_obligations: "No"          # non-compete, non-solicit, confidentiality that would affect the role
  own_or_operate_another_business: "No"
  employed_by_us_government: "No"
experience_facts:
  most_recent_internship_employer: "…"        # "Where did you complete your most recent internship?"
  current_employer: "…"
  professional_references: "Available upon request"
work_regions:
  regions_authorized_to_work: "United States (North America) only"

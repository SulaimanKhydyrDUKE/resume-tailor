<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --line: #e5e7eb; --ink: #111827; --muted: #6b7280; --accent: #2563eb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #root { height: 100%; }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  .watch { color: var(--muted); font-size: 13px; }
  .watch b { color: var(--ink); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #9ca3af; }
  .dot.on { background: #16a34a; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .chip.active { border-color: var(--accent); color: var(--accent); }
  .chip small { color: var(--muted); margin-left: 4px; }
  input.search { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 220px; }
  .body { display: grid; grid-template-columns: 400px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  main { overflow-y: auto; padding: 20px 28px 60px; }
  .row { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 3px; }
  .row:hover { background: #f3f4f6; }
  .row.active { background: #eff6ff; box-shadow: inset 3px 0 0 var(--accent); }
  .row .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .row .co { font-weight: 600; }
  .row .role { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; }
  .badge { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: #dcfce7; color: #166534; }
  .badge.warn { background: #fef3c7; color: #92400e; }
  .badge.bad { background: #fee2e2; color: #991b1b; }
  .badge.info { background: #dbeafe; color: #1e40af; }
  .badge.muted { background: #e5e7eb; color: #374151; }
  .empty { color: var(--muted); padding: 60px; text-align: center; }
  .detail h2 { margin: 0 0 4px; font-size: 22px; }
  .detail .sub { color: var(--muted); margin-bottom: 14px; }
  .detail a { color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
  .card h3 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .status-line { display: flex; gap: 10px; align-items: flex-start; }
  .status-line p { margin: 0; white-space: pre-wrap; }
  .judges { display: flex; gap: 10px; flex-wrap: wrap; }
  .judge { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 160px; }
  .judge .score { font-size: 20px; font-weight: 700; }
  .judge .who { color: var(--muted); font-size: 12px; }
  iframe.pdf { width: 100%; height: 720px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .shot img { width: 100%; border: 1px solid var(--line); border-radius: 8px; max-height: 420px; object-fit: cover; object-position: top; }
  .shot .cap { color: var(--muted); font-size: 12px; margin-top: 4px; }
  table.answers { width: 100%; border-collapse: collapse; }
  table.answers th, table.answers td { text-align: left; vertical-align: top; padding: 8px 8px; border-top: 1px solid var(--line); font-size: 13px; }
  table.answers th { color: var(--muted); font-weight: 600; border-top: none; }
  table.answers td.q { width: 34%; }
  table.answers td.a { white-space: pre-wrap; }
  table.answers td.src { color: var(--muted); width: 22%; font-size: 12px; }
  .section-head td { background: #f9fafb; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .reason { color: #991b1b; }
  .none { color: var(--muted); font-style: italic; }
  .req { color: #b45309; font-weight: 700; margin-left: 3px; }
  details.log summary { cursor: pointer; color: var(--muted); }
  details.log pre { font-size: 12px; white-space: pre-wrap; background: #f9fafb; padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; }
  .err { color: #991b1b; }
  .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .actions button.quiet { background: var(--panel); color: var(--ink); border-color: var(--line); }
  .actions button:disabled { opacity: .5; cursor: default; }
  .actions .msg { flex-basis: 100%; color: var(--muted); font-size: 13px; }
  .workers { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; text-align: left; }
  .worker { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .worker h4 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .worker h4 small { color: var(--muted); font-weight: 400; }
  .worker .stage { font-size: 13px; margin: 2px 0 8px; }
  .worker .stage b { font-weight: 600; }
  .worker .idle { color: var(--muted); }
  .worker ul { list-style: none; margin: 0 0 8px; padding: 0; }
  .worker li { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 3px 0; border-top: 1px solid var(--line); }
  .worker li span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .worker li .t { color: var(--muted); white-space: nowrap; }
  .worker pre { font-size: 11px; white-space: pre-wrap; background: #f9fafb; padding: 8px; border-radius: 8px; max-height: 150px; overflow: auto; margin: 0; color: #374151; }
  .workers-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 10px; }
  .workers-head h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .chip.link { border-style: dashed; }
  .flows { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .flow { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .flow h3 { margin: 0 0 4px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .flow .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .flow svg { width: 100%; height: auto; display: block; overflow: visible; }
  .flow .lbl { font-size: 12px; fill: var(--ink); }
  .flow .lbl.muted { fill: var(--muted); }
  .flow .lbl.n { font-weight: 700; font-variant-numeric: tabular-nums; }
  .flow path.band { opacity: .55; transition: opacity .15s; }
  .flow path.band:hover { opacity: .9; }
  .flow-toggle { display: flex; gap: 6px; margin: 0 0 10px; }
  table.stages { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.stages td, table.stages th { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); }
  table.stages th { color: var(--muted); font-weight: 600; border-top: none; }
  .stage-pill { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; color: #fff; }
  ul.mail { list-style: none; margin: 0; padding: 0; }
  ul.mail li { display: grid; grid-template-columns: 90px 110px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
  ul.mail li .t { color: var(--muted); white-space: nowrap; }
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const STATUS = {
  applied: ["Applied", "ok"],
  needs_review: ["Needs review", "warn"],
  blocked: ["Blocked", "bad"],
  ready_not_submitted: ["Ready (dry run)", "info"],
  awaiting_approval: ["Awaiting your approval", "warn"],
  by_hand: ["In your hands", "info"],
  needs_login: ["Needs login", "warn"],
  error: ["Error", "bad"],
  fit_rejected: ["Judges said no", "muted"],
  skipped: ["Skipped", "muted"],
  tailored_only: ["Tailored only", "muted"],
};
const ORDER = Object.keys(STATUS);

function Badge({ status }) {
  const [label, tone] = STATUS[status] || [status, "muted"];
  return <span className={"badge " + tone}>{label}</span>;
}

function fmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function fmtPosted(ts) {
  return ts ? new Date(ts * 1000).toLocaleDateString([], { month: "short", day: "numeric" }) : "";
}

// "hiring manager 90/100 pass | screener 95/100 pass (revised ×1)"
function parseFit(fit) {
  const clean = (fit || "").replace(/\s*\(revised[^)]*\)\s*$/, "");
  return clean.split("|").map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/^(.*?)\s+(\d+)\/100\s+(\S+)$/);
    return m ? { who: m[1], score: +m[2], verdict: m[3] } : { who: s, score: null, verdict: "" };
  });
}
function revisedTag(fit) {
  const m = (fit || "").match(/\(revised[^)]*\)/);
  return m ? m[0] : "";
}

function Judges({ fit }) {
  const js = parseFit(fit);
  if (!js.length) return <span className="none">not judged (stopped before the resume was made)</span>;
  return (
    <div className="judges">
      {js.map((j, i) => (
        <div className="judge" key={i}>
          <div className="score">{j.score === null ? "—" : j.score}<span style={{ fontSize: 12, color: "#6b7280" }}> /100</span></div>
          <div className="who">{j.who} · {j.verdict}</div>
        </div>
      ))}
      {revisedTag(fit) ? <div className="judge"><div className="who">résumé {revisedTag(fit).replace(/[()]/g, "")} from the judges' notes</div></div> : null}
    </div>
  );
}

function workerName(w) {
  return w === "fresh" ? "Fresh lane" : "Worker " + (Number(w) + 1);
}

// Colours: one per outcome and one per stage, kept apart from the accent.
const STATUS_COLOR = {
  applied: "#16a34a", by_hand: "#0ea5e9", awaiting_approval: "#f97316", needs_review: "#f59e0b",
  needs_login: "#8b5cf6", blocked: "#ef4444", error: "#b91c1c", fit_rejected: "#94a3b8",
  skipped: "#cbd5e1", tailored_only: "#a3a3a3", ready_not_submitted: "#38bdf8",
};
const STAGE_COLOR = { offer: "#16a34a", interview: "#2563eb", oa: "#7c3aed", rejected: "#ef4444", "no reply yet": "#9ca3af", applied: "#6b7280" };
const STAGE_LABEL = { offer: "Offer", interview: "Interview", oa: "Online assessment", rejected: "Rejected", "no reply yet": "No reply yet", applied: "Confirmed only" };

// A flow diagram: columns of stacked nodes, bands between them whose
// thickness is the count. Drawn by hand — two or three columns is all it is.
function Sankey({ columns, links, height = 300, leftPad = 8, rightPad = 210, gap = 10 }) {
  const width = 640;
  const colX = (i) => leftPad + i * ((width - leftPad - rightPad - 26) / Math.max(1, columns.length - 1));
  const barW = 26;
  // Node slots: each column stacks its nodes with a gap, scaled to the column's own total.
  const slots = {};
  columns.forEach((col, ci) => {
    const total = col.reduce((a, n) => a + n.value, 0) || 1;
    const usable = height - gap * Math.max(0, col.length - 1);
    let y = 0;
    col.forEach(n => {
      const h = Math.max(n.value > 0 ? 2 : 0, usable * n.value / total);
      slots[n.id] = { x: colX(ci), y, h, col: ci, node: n, outY: y, inY: y };
      y += h + (n.value > 0 ? gap : 0);
    });
  });
  const band = (a, b, v) => {
    const s = slots[a], t = slots[b];
    if (!s || !t || !v) return null;
    const sTotal = s.node.value || 1, tTotal = t.node.value || 1;
    const sh = s.h * v / sTotal, th = t.h * v / tTotal;
    const x0 = s.x + barW, x1 = t.x, y0 = s.outY, y1 = t.inY;
    s.outY += sh; t.inY += th;
    const cx = (x0 + x1) / 2;
    return `M${x0},${y0} C${cx},${y0} ${cx},${y1} ${x1},${y1} L${x1},${y1 + th} C${cx},${y1 + th} ${cx},${y0 + sh} ${x0},${y0 + sh} Z`;
  };
  const paths = links.map(l => ({ ...l, d: band(l.from, l.to, l.value) })).filter(p => p.d);
  return (
    <svg viewBox={`0 0 ${width} ${height + 24}`} role="img">
      <g transform="translate(0,12)">
        {paths.map((p, i) => (
          <path key={i} className="band" d={p.d} fill={p.color}>
            <title>{p.title || `${p.value}`}</title>
          </path>
        ))}
        {Object.values(slots).map(s => (
          <g key={s.node.id}>
            <rect x={s.x} y={s.y} width={barW} height={Math.max(s.h, s.node.value > 0 ? 2 : 0)} fill={s.node.color} rx={3}>
              <title>{s.node.label}: {s.node.value}</title>
            </rect>
            {s.col === columns.length - 1 && s.node.value > 0 ? (
              <text className="lbl" x={s.x + barW + 8} y={s.y + Math.max(s.h, 2) / 2} dominantBaseline="middle">
                <tspan className="lbl n">{s.node.value}</tspan> <tspan className="lbl muted">{s.node.label}</tspan>
              </text>
            ) : null}
            {s.col === 0 ? (
              <text className="lbl" x={s.x} y={-2} textAnchor="start">
                <tspan className="lbl n">{s.node.value}</tspan> <tspan className="lbl muted">{s.node.label}</tspan>
              </text>
            ) : null}
            {s.col > 0 && s.col < columns.length - 1 && s.h > 14 ? (
              <text className="lbl" x={s.x + barW / 2} y={s.y - 3} textAnchor="middle" fontSize="11">{s.node.label}</text>
            ) : null}
          </g>
        ))}
      </g>
    </svg>
  );
}

function Flows({ flows }) {
  const [view, setView] = useState("two");
  if (!flows || flows.error) return <div className="empty">results tracker: {flows?.error || "no data yet"} — run `resume-tailor mail scan`</div>;
  const st = flows.attempts.by_status || {};
  const statusNodes = ORDER.filter(s => st[s]).map(s => ({ id: "s:" + s, label: STATUS[s][0], value: st[s], color: STATUS_COLOR[s] || "#9ca3af" }));
  const attempts = [[{ id: "all", label: "attempts", value: flows.attempts.total, color: "#374151" }], statusNodes];
  const attemptLinks = statusNodes.map(n => ({ from: "all", to: n.id, value: n.value, color: n.color, title: `${n.label}: ${n.value}` }));
  const sg = flows.applied.by_stage || {};
  const stageOrder = ["offer", "interview", "oa", "no reply yet", "rejected"];
  const stageNodes = stageOrder.filter(s => sg[s]).map(s => ({ id: "g:" + s, label: STAGE_LABEL[s], value: sg[s], color: STAGE_COLOR[s] }));
  const applied = [[{ id: "ap", label: "companies applied to", value: flows.applied.total, color: "#16a34a" }], stageNodes];
  const appliedLinks = stageNodes.map(n => ({ from: "ap", to: n.id, value: n.value, color: n.color, title: `${n.label}: ${n.value}` }));
  // The chained view: attempts fan out by outcome, and the applied band carries on into what the inbox says.
  const chainCols = [attempts[0], statusNodes.map(n => ({ ...n, id: "c" + n.id })), stageNodes.map(n => ({ ...n, id: "c" + n.id }))];
  const appliedCount = (st.applied || 0) + (st.by_hand || 0);
  const chainLinks = [
    ...statusNodes.map(n => ({ from: "all", to: "c" + n.id, value: n.value, color: n.color, title: `${n.label}: ${n.value}` })),
    ...stageNodes.map(n => ({ from: "cs:applied", to: "c" + n.id, value: Math.round(n.value * (st.applied || 0) / Math.max(1, flows.applied.total)), color: n.color, title: `${n.label}: ${n.value} companies` })),
  ];
  return (
    <div>
      <div className="flow-toggle">
        <span className={"chip " + (view === "two" ? "active" : "")} onClick={() => setView("two")}>Two flows</span>
        <span className={"chip " + (view === "chain" ? "active" : "")} onClick={() => setView("chain")}>One chained flow</span>
        <span className="watch" style={{ marginLeft: "auto" }}>{flows.scanned_at ? "inbox scanned " + new Date(flows.scanned_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "inbox not scanned yet"}</span>
      </div>
      {view === "two" ? (
        <div className="flows">
          <div className="flow">
            <h3>Every attempt, by outcome</h3>
            <div className="sub">{flows.attempts.total} postings the loop worked on, and where each ended up</div>
            <Sankey columns={attempts} links={attemptLinks} height={Math.max(220, statusNodes.length * 34)} />
          </div>
          <div className="flow">
            <h3>Applied, by what the inbox says</h3>
            <div className="sub">{flows.applied.total} companies with an application in; stages read from your e-mail</div>
            <Sankey columns={applied} links={appliedLinks} height={Math.max(220, stageNodes.length * 44)} />
          </div>
        </div>
      ) : (
        <div className="flows" style={{ gridTemplateColumns: "1fr" }}>
          <div className="flow">
            <h3>From every attempt to every reply</h3>
            <div className="sub">the applied band carries on into the inbox stages ({appliedCount} applied postings across {flows.applied.total} companies)</div>
            <Sankey columns={chainCols} links={chainLinks} height={Math.max(260, statusNodes.length * 34)} rightPad={200} />
          </div>
        </div>
      )}
      {flows.companies?.filter(c => c.stage && c.stage !== "applied").length ? (
        <div className="card" style={{ marginTop: 0 }}>
          <h3>Where something happened</h3>
          <table className="stages">
            <thead><tr><th>Company</th><th>Stage</th><th>Last mail</th><th>Dates mentioned</th></tr></thead>
            <tbody>
              {flows.companies.filter(c => c.stage && c.stage !== "applied").map(c => (
                <tr key={c.key}>
                  <td>{c.company}</td>
                  <td><span className="stage-pill" style={{ background: STAGE_COLOR[c.stage] || "#6b7280" }}>{STAGE_LABEL[c.stage] || c.stage}</span></td>
                  <td>{c.last ? fmtWhen(c.last) : ""}</td>
                  <td>{(c.dates || []).slice(0, 3).join("; ")}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ) : null}
    </div>
  );
}

// One card per process the supervisor runs: what it is doing this minute,
// its last outcomes, and the last lines it wrote to the log.
function Workers({ data, onPick }) {
  const w = data?.watch || {};
  const procs = w.processes || [];
  const nowBy = {};
  for (const n of data?.workers_now || []) nowBy[String(n.worker ?? "")] = n;
  const apps = data?.applications || [];
  if (!procs.length) return <div className="empty">no workers are running (start the loop with overnight.sh)</div>;
  return (
    <div>
      <div className="workers-head">
        <h3>Where each worker is</h3>
        <span className="watch">{w.label}{data?.pool && data.pool.new != null ? ` · ${data.pool.new} postings waiting in the pool` : ""}</span>
      </div>
      <div className="workers">
        {procs.map(p => {
          const key = String(p.worker);
          const now = nowBy[key];
          const recent = apps.filter(a => String(a.worker) === key).slice(0, 4);
          const logs = (w.worker_logs || {})[key === "fresh" ? "fresh" : "w" + key] || [];
          return (
            <div className="worker" key={key}>
              <h4><span className={"dot " + (p.alive ? "on" : "")}></span>{workerName(key)} <small>{p.alive ? "pid " + p.pid : "down"}{key === "fresh" ? " · every source, every 5 min" : ""}</small></h4>
              {now && now.stage && now.stage !== "idle"
                ? <div className="stage"><b>{now.company || "?"}</b>{now.role ? " — " + now.role : ""}<br />{now.stage} since {new Date(now.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</div>
                : <div className="stage idle">{p.alive ? (key === "fresh" ? "watching the sources; nothing new since the last poll" : "idle between passes (next look within 10 min)") : "not running"}</div>}
              {recent.length ? (
                <ul>
                  {recent.map(a => (
                    <li key={a.id} onClick={() => onPick(a.id)} style={{ cursor: "pointer" }}>
                      <span>{a.company || "?"}{a.role ? " — " + a.role : ""}</span>
                      <span className="t"><Badge status={a.status} /> {a.when ? new Date(a.when).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : ""}</span>
                    </li>
                  ))}
                </ul>
              ) : null}
              {logs.length ? <pre>{logs.join("\n")}</pre> : null}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Header({ data, err, filter, setFilter, q, setQ, showWorkers }) {
  const counts = data?.counts || {};
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const w = data?.watch || {};
  const busy = (data?.workers_now || []).filter(n => n.stage && n.stage !== "idle").length;
  const procs = (w.processes || []).filter(p => p.alive).length;
  return (
    <header>
      <h1>Applications</h1>
      <span className="watch">
        <span className={"dot " + (w.running || w.pass_running ? "on" : "")}></span>
        <b>{w.label || (w.running ? "loop running" : "loop stopped")}</b>
        {data?.pool && data.pool.new != null ? <span className="muted"> · {data.pool.new} new postings waiting in the pool ({data.pool.cached} discovered)</span> : null}
        {procs ? <span> · <b>{busy} of {procs}</b> busy right now</span> : <span> · idle</span>}
        {data ? <span> · refreshed {new Date(data.generated_at).toLocaleTimeString()}</span> : null}
        {err ? <span className="err"> · {err}</span> : null}
      </span>
      <div className="chips">
        <span className="chip link" onClick={showWorkers}>Workers<small>{procs}</small></span>
        <span className={"chip " + (filter === "all" ? "active" : "")} onClick={() => setFilter("all")}>All<small>{total}</small></span>
        {ORDER.filter(s => counts[s]).map(s => (
          <span key={s} className={"chip " + (filter === s ? "active" : "")} onClick={() => setFilter(s)}>
            {STATUS[s][0]}<small>{counts[s]}</small>
          </span>
        ))}
      </div>
      <input className="search" placeholder="Search company or role" value={q} onChange={e => setQ(e.target.value)} />
    </header>
  );
}

function Row({ app, active, onClick }) {
  return (
    <div className={"row " + (active ? "active" : "")} onClick={onClick}>
      <div className="top"><span className="co">{app.company || "?"}</span><Badge status={app.status} /></div>
      <div className="role">{app.role}</div>
      <div className="meta">
        {app.when ? <span>{fmtWhen(app.when)}</span> : <span>earlier</span>}
        {app.fit ? <span>{parseFit(app.fit).map(j => j.score).join(" / ")}</span> : null}
        {app.locations?.length ? <span>{app.locations.slice(0, 2).join("; ")}</span> : null}
        {app.worker !== undefined && app.worker !== "" ? <span>{workerName(String(app.worker))}</span> : null}
      </div>
    </div>
  );
}

function Screenshots({ shots }) {
  const kinds = [["post-submit", "After submit"], ["pre-submit", "Before submit"], ["needs-review", "As left for review"], ["dry-run", "Dry run"]];
  const have = kinds.filter(([k]) => shots && shots[k]);
  if (!have.length) return <span className="none">no screenshot for this attempt</span>;
  return (
    <div className="shots">
      {have.map(([k, cap]) => (
        <div className="shot" key={k}>
          <a href={shots[k]} target="_blank" rel="noreferrer"><img src={shots[k]} alt={cap} /></a>
          <div className="cap">{cap} · open full size</div>
        </div>
      ))}
    </div>
  );
}

function Answers({ answers, status }) {
  if (!answers || !answers.length) {
    return <span className="none">
      {["applied", "needs_review", "ready_not_submitted", "awaiting_approval"].includes(status)
        ? "answers were not recorded for this attempt (it ran before recording existed); the next retry will record them"
        : "no form was filled for this posting"}
    </span>;
  }
  const bySection = [];
  for (const a of answers) {
    const sec = a.section || "";
    let g = bySection.find(x => x.section === sec);
    if (!g) { g = { section: sec, items: [] }; bySection.push(g); }
    g.items.push(a);
  }
  return (
    <table className="answers">
      <thead><tr><th>Question</th><th>Answer given</th><th>Where it came from</th></tr></thead>
      <tbody>
        {bySection.map(g => (
          <React.Fragment key={g.section}>
            {g.section ? <tr className="section-head"><td colSpan={3}>{g.section}</td></tr> : null}
            {g.items.map((a, i) => (
              <tr key={i}>
                <td className="q">{a.question}{a.required ? <span className="req">*</span> : null}
                  {a.options?.length ? <div className="none">{a.options.join(" · ")}</div> : null}</td>
                <td className="a">{a.answer ? a.answer : <span className="none">left blank</span>}
                  {a.reason ? <div className="reason">{a.reason}</div> : null}</td>
                <td className="src">{a.source || (a.answer ? "the page had it" : "")}</td>
              </tr>
            ))}
          </React.Fragment>
        ))}
      </tbody>
    </table>
  );
}

function Actions({ app }) {
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const post = async (url, body) => {
    setBusy(true);
    try {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
      const j = await r.json();
      if (j.error) setMsg("Could not do that: " + j.error);
      else if (url.includes("/review/")) setMsg("Opening in Chrome. The posting appears first; the form is filled in over the next minute or two, longer if the resume has to be made or revised first. Check it, then press Submit yourself; close the window when done. You can open several postings at once.");
      else setMsg("Recorded.");
    } catch (e) { setMsg(String(e)); }
    setBusy(false);
  };
  return (
    <div className="actions">
      {app.reviewing ? <span className="badge info">Chrome window open since {new Date(app.reviewing.since).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span> : null}
      {app.status === "awaiting_approval" ? <button disabled={busy} onClick={() => { if (window.confirm(`Submit the application to ${app.company}?`)) post(`/api/approve/${encodeURIComponent(app.id)}`); }}>Approve and submit</button> : null}
      {["needs_login", "by_hand", "blocked"].includes(app.status) ? <button disabled={busy} onClick={() => post(`/api/login/${encodeURIComponent(app.id)}`)}>Log in here, then let the tool apply</button> : null}
      <button disabled={busy} className={app.status === "awaiting_approval" ? "quiet" : ""} onClick={() => post(`/api/review/${encodeURIComponent(app.id)}`)}>{app.reviewing ? "Open another window" : "Open in Chrome to finish by hand"}</button>
      {app.status !== "applied" ? <button disabled={busy} className="quiet" onClick={() => post(`/api/mark/${encodeURIComponent(app.id)}`, { status: "applied" })}>Mark as applied</button> : null}
      {app.status !== "skipped" ? <button disabled={busy} className="quiet" onClick={() => post(`/api/mark/${encodeURIComponent(app.id)}`, { status: "skipped" })}>Mark as skipped</button> : null}
      {msg ? <div className="msg">{msg}</div> : null}
    </div>
  );
}

function Detail({ app }) {
  return (
    <div className="detail">
      <h2>{app.company || "?"} <span style={{ fontWeight: 400, color: "#6b7280" }}>· {app.role}</span></h2>
      <div className="sub">
        {app.url ? <a href={app.url} target="_blank" rel="noreferrer">posting</a> : null}
        {app.locations?.length ? <span> · {app.locations.join("; ")}</span> : null}
        {app.date_posted ? <span> · posted {fmtPosted(app.date_posted)}</span> : null}
        {app.when ? <span> · attempted {fmtWhen(app.when)}</span> : null}
      </div>

      <div className="card">
        <h3>Outcome</h3>
        <div className="status-line"><Badge status={app.status} /><p>{app.detail}</p></div>
        <Actions app={app} />
      </div>

      <div className="card">
        <h3>What the inbox says {app.stage ? <span className="stage-pill" style={{ background: STAGE_COLOR[app.stage] || "#6b7280", textTransform: "none", letterSpacing: 0 }}>{STAGE_LABEL[app.stage] || app.stage}</span> : null}</h3>
        {app.mail?.length ? (
          <ul className="mail">
            {app.mail.map(m => (
              <li key={m.uid}>
                <span className="t">{m.when ? fmtWhen(m.when) : ""}</span>
                <span><span className="stage-pill" style={{ background: STAGE_COLOR[m.stage] || "#9ca3af" }}>{STAGE_LABEL[m.stage] || m.stage}</span></span>
                <span>{m.subject}{m.note ? <span className="none"> · {m.note}</span> : null}{m.date ? <span className="none"> · {m.date}</span> : null}</span>
              </li>
            ))}
          </ul>
        ) : <span className="none">no mail from this company matched yet</span>}
        {app.addresses?.length ? <div className="sub" style={{ marginTop: 8 }}>recruiting addresses seen: {app.addresses.map(a => a.address).join(", ")}</div> : null}
      </div>

      <div className="card">
        <h3>Judges</h3>
        <Judges fit={app.fit} />
      </div>

      <div className="card">
        <h3>Answers given</h3>
        <Answers answers={app.answers} status={app.status} />
      </div>

      <div className="card">
        <h3>Resume sent {app.pdf ? <a href={app.pdf} target="_blank" rel="noreferrer" style={{ textTransform: "none", letterSpacing: 0 }}>open PDF</a> : null}</h3>
        {app.pdf ? <iframe className="pdf" src={app.pdf} title="resume" /> : <span className="none">no resume was made for this posting</span>}
      </div>

      <div className="card">
        <h3>Screenshots</h3>
        <Screenshots shots={app.screenshots} />
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [filter, setFilter] = useState("all");
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(null);

  useEffect(() => {
    let alive = true;
    const load = async () => {
      try {
        const r = await fetch("/api/index", { cache: "no-store" });
        const j = await r.json();
        if (!alive) return;
        if (j.error) { setErr(j.error); return; }
        setData(j); setErr(null);
      } catch (e) { if (alive) setErr(String(e)); }
    };
    load();
    const t = setInterval(load, 8000);
    return () => { alive = false; clearInterval(t); };
  }, []);

  const apps = useMemo(() => (data?.applications || []).filter(a =>
    (filter === "all" || a.status === filter) &&
    (!q || (a.company + " " + a.role).toLowerCase().includes(q.toLowerCase()))
  ), [data, filter, q]);
  const current = (data?.applications || []).find(a => a.id === sel);

  return (
    <div className="app">
      <Header data={data} err={err} filter={filter} setFilter={setFilter} q={q} setQ={setQ} showWorkers={() => setSel(null)} />
      <div className="body">
        <aside>
          {apps.map(a => <Row key={a.id} app={a} active={a.id === sel} onClick={() => setSel(a.id)} />)}
          {data && !apps.length ? <div className="empty">nothing here yet</div> : null}
          {!data && !err ? <div className="empty">loading…</div> : null}
        </aside>
        <main>
          {current ? <Detail app={current} /> : (
            <div>
              <Flows flows={data?.flows} />
              <Workers data={data} onPick={setSel} />
              <div className="empty" style={{ padding: "30px 0 0" }}>
                <p>Pick an application on the left for its answers, résumé and screenshots.</p>
                {data?.watch?.log_tail?.length ? (
                  <details className="log">
                    <summary>whole loop log (last lines)</summary>
                    <pre>{data.watch.log_tail.join("\n")}</pre>
                  </details>
                ) : null}
              </div>
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications</title>
<style>
  /* One accent for the whole page — the green of the job boards the loop applies through — with a soft tint for selected rows and a darker ink for text on it. */
  :root { --bg: #f6f7f9; --panel: #fff; --line: #e5e7eb; --ink: #111827; --muted: #6b7280; --accent: #0f9d6e; --accent-soft: #e6f6ef; --accent-ink: #0b7a55; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #root { height: 100%; }
  .app { display: grid; grid-template-rows: auto auto auto 1fr; height: 100vh; }
  .tabs { display: flex; align-items: flex-end; gap: 4px; padding: 10px 20px 0; background: #dfe3e8; border-bottom: 1px solid #cfd4db; }
  .tab { padding: 8px 18px 9px; border: 1px solid #cfd4db; border-bottom: none; border-radius: 10px 10px 0 0; background: #eceff3; color: var(--muted); cursor: pointer; font-size: 13px; user-select: none; }
  .tab:hover { background: #f3f5f8; }
  .tab.active { background: var(--panel); color: var(--ink); font-weight: 600; margin-bottom: -1px; padding-bottom: 10px; }
  .tab small { color: var(--muted); margin-left: 6px; font-weight: 400; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .toolbar:empty { display: none; }
  .body.single { grid-template-columns: 1fr; }
  .files { display: grid; grid-template-columns: 460px 1fr; gap: 16px; min-height: 0; }
  .files .list { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow-y: auto; max-height: calc(100vh - 260px); }
  .files .list .row { grid-template-columns: 1fr; }
  .files .list .row .top { align-items: center; }
  .files .list .row .links { display: flex; gap: 10px; font-size: 12px; }
  .files iframe.pdf { height: calc(100vh - 340px); }
  .secret { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 16px; margin-top: 12px; background: #fafafa; }
  .secret .kv { display: grid; grid-template-columns: 170px 1fr; gap: 6px 12px; font-size: 13px; align-items: baseline; }
  .secret .kv b { color: var(--muted); font-weight: 600; }
  .secret code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--accent-soft); padding: 2px 6px; border-radius: 6px; }
  .secret button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; margin-right: 8px; }
  .secret button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hosts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .hosts span { background: #f3f4f6; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .hosts span.plain { background: none; border: none; padding: 2px 0; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  .watch { color: var(--muted); font-size: 13px; }
  .watch b { color: var(--ink); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #9ca3af; }
  .dot.on { background: #16a34a; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .chip.active { border-color: var(--accent); color: var(--accent); }
  .chip small { color: var(--muted); margin-left: 4px; }
  input.search { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 220px; }
  .body { display: grid; grid-template-columns: 400px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  main { overflow-y: auto; padding: 20px 28px 60px; }
  .row { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 3px; }
  .row:hover { background: #f3f4f6; }
  .row.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .row .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .row .co { font-weight: 600; }
  .row .role { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; }
  .badge { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: #dcfce7; color: #166534; }
  .badge.warn { background: #fef3c7; color: #92400e; }
  .badge.bad { background: #fee2e2; color: #991b1b; }
  .badge.info { background: #dbeafe; color: #1e40af; }
  .badge.muted { background: #e5e7eb; color: #374151; }
  .empty { color: var(--muted); padding: 60px; text-align: center; }
  .calwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .cal h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .cal .nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cal .nav b { font-size: 15px; min-width: 150px; }
  .cal .nav button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 9px; cursor: pointer; font: inherit; }
  .cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { color: var(--muted); font-size: 11px; text-align: center; padding-bottom: 2px; }
  .cal .cell { min-height: 60px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; cursor: pointer; font-size: 12px; background: #fff; }
  .cal .cell.blank { border-color: transparent; background: transparent; cursor: default; }
  .cal .cell:hover { background: #f3f4f6; }
  .cal .cell.sel { background: var(--accent-soft); border-color: var(--accent); }
  .cal .cell.today .n { color: var(--accent); font-weight: 700; }
  .cal .cell .n { color: var(--muted); }
  .cal .pill { display: block; max-width: 100%; border-radius: 999px; padding: 0 7px; color: #fff; font-size: 11px; font-weight: 600; margin: 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .daypanel { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .daypanel .card { margin: 0; }
  .evt { border-top: 1px solid var(--line); padding: 8px 0; display: grid; gap: 2px; }
  .evt:first-child { border-top: none; }
  .evt .t { color: var(--muted); font-size: 12px; }
  .evt.app { cursor: pointer; }
  .evt.app:hover { background: #f9fafb; }
  .evt .links a { margin-right: 10px; font-size: 12px; }
  .upcoming { display: grid; grid-template-columns: 130px 110px 1fr; gap: 6px 12px; font-size: 13px; align-items: baseline; }
  .upcoming .k { color: #fff; border-radius: 999px; padding: 0 8px; font-size: 11px; font-weight: 600; text-align: center; }
  .toggle { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .detail h2 { margin: 0 0 4px; font-size: 22px; }
  .detail .sub { color: var(--muted); margin-bottom: 14px; }
  .detail a { color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
  .card h3 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .status-line { display: flex; gap: 10px; align-items: flex-start; }
  .status-line p { margin: 0; white-space: pre-wrap; }
  .judges { display: flex; gap: 10px; flex-wrap: wrap; }
  .judge { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 160px; }
  .judge .score { font-size: 20px; font-weight: 700; }
  .judge .who { color: var(--muted); font-size: 12px; }
  iframe.pdf { width: 100%; height: 720px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .shot img { width: 100%; border: 1px solid var(--line); border-radius: 8px; max-height: 420px; object-fit: cover; object-position: top; }
  .shot .cap { color: var(--muted); font-size: 12px; margin-top: 4px; }
  table.answers { width: 100%; border-collapse: collapse; }
  table.answers th, table.answers td { text-align: left; vertical-align: top; padding: 8px 8px; border-top: 1px solid var(--line); font-size: 13px; }
  table.answers th { color: var(--muted); font-weight: 600; border-top: none; }
  table.answers td.q { width: 34%; }
  table.answers td.a { white-space: pre-wrap; }
  table.answers td.src { color: var(--muted); width: 22%; font-size: 12px; }
  .section-head td { background: #f9fafb; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .reason { color: #991b1b; }
  .none { color: var(--muted); font-style: italic; }
  .req { color: #b45309; font-weight: 700; margin-left: 3px; }
  details.log summary { cursor: pointer; color: var(--muted); }
  details.log pre { font-size: 12px; white-space: pre-wrap; background: #f9fafb; padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; }
  .err { color: #991b1b; }
  .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .actions button.quiet { background: var(--panel); color: var(--ink); border-color: var(--line); }
  .actions button:disabled { opacity: .5; cursor: default; }
  .actions .msg { flex-basis: 100%; color: var(--muted); font-size: 13px; }
  .workers { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; text-align: left; }
  .worker { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .worker h4 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .worker h4 small { color: var(--muted); font-weight: 400; }
  .worker .stage { font-size: 13px; margin: 2px 0 8px; }
  .worker .stage b { font-weight: 600; }
  .worker .idle { color: var(--muted); }
  .worker ul { list-style: none; margin: 0 0 8px; padding: 0; }
  .worker li { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 3px 0; border-top: 1px solid var(--line); }
  .worker li span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .worker li .t { color: var(--muted); white-space: nowrap; }
  .worker pre { font-size: 11px; white-space: pre-wrap; background: #f9fafb; padding: 8px; border-radius: 8px; max-height: 150px; overflow: auto; margin: 0; color: #374151; }
  .workers-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 10px; }
  .workers-head h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .chip.link { border-style: dashed; }
  .flows { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .flow { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .flow h3 { margin: 0 0 4px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .flow .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .flow svg { width: 100%; height: auto; display: block; overflow: visible; }
  .flow .lbl { font-size: 12px; fill: var(--ink); }
  .flow .lbl.muted { fill: var(--muted); }
  .flow .lbl.n { font-weight: 700; font-variant-numeric: tabular-nums; }
  .flow path.band { opacity: .55; transition: opacity .15s; }
  .flow path.band:hover { opacity: .9; }
  .flow-toggle { display: flex; gap: 6px; margin: 0 0 10px; }
  table.stages { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.stages td, table.stages th { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); }
  table.stages th { color: var(--muted); font-weight: 600; border-top: none; }
  .stage-pill { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; color: #fff; }
  ul.mail { list-style: none; margin: 0; padding: 0; }
  ul.mail li { display: grid; grid-template-columns: 90px 110px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
  ul.mail li .t { color: var(--muted); white-space: nowrap; }
  /* --- Settings tab: a section rail on the left, cards on the right --- */
  .settings { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 26px; max-width: 1180px; }
  .snav { position: sticky; top: 0; align-self: start; display: grid; gap: 4px; }
  .snav .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--muted); cursor: pointer; font-weight: 500; font-size: 13.5px; user-select: none; }
  .snav .item:hover { background: #f3f4f6; color: var(--ink); }
  .snav .item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .snav .item svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .snav .item small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .snav .procs { margin-top: 14px; padding: 12px 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 12.5px; color: var(--muted); display: grid; gap: 8px; }
  .snav .procs b { color: var(--ink); }
  .spage h2 { margin: 0 0 2px; font-size: 21px; }
  .spage .lede { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
  .scard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin: 0 0 16px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); }
  .scard > h3 { margin: 0; font-size: 15.5px; text-transform: none; letter-spacing: 0; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .scard > h3 .pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; }
  .scard .desc { color: var(--muted); font-size: 13px; margin: 4px 0 16px; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px 18px; }
  .fgrid .wide { grid-column: 1 / -1; }
  .f label { display: block; font-size: 12.5px; font-weight: 600; color: #374151; margin-bottom: 5px; }
  .f label code { font-weight: 400; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; margin-left: 6px; }
  .f input[type=text], .f input[type=number], .f input[type=password], .f input[type=url], .f input[type=email], .f select, .f textarea, .chipsin, .gen-row .val > input, .gen-row .val > textarea, .gen-row .val > select {
    width: 100%; border: 1px solid #d1d5db; border-radius: 10px; padding: 9px 12px; font: inherit; background: #fff; color: var(--ink); }
  .f textarea, .gen-row .val > textarea { resize: vertical; min-height: 40px; line-height: 1.4; }
  .f input:focus, .f select:focus, .f textarea:focus, .chipsin:focus-within, .gen-row .val > input:focus, .gen-row .val > textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .f .help { color: var(--muted); font-size: 12px; margin-top: 5px; line-height: 1.4; }
  .btn { font: inherit; font-size: 13.5px; font-weight: 600; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .btn.quiet { background: #fff; color: var(--ink); border-color: #d1d5db; }
  .btn.quiet:hover { background: #f9fafb; border-color: #9ca3af; }
  .btn.small { padding: 5px 12px; font-size: 12.5px; }
  .btn.warn { background: #f97316; border-color: #f97316; }
  .btn.warn:hover { background: #ea580c; border-color: #ea580c; }
  .btn.danger { background: #dc2626; border-color: #dc2626; }
  .btn.danger:hover { background: #b91c1c; border-color: #b91c1c; }
  .loopctl { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; }
  .loopctl .ok { color: var(--accent-ink); }
  .loopctl .bad { color: #b91c1c; }
  .btn:disabled { opacity: .5; cursor: default; }
  .sfoot { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .sfoot .note { color: var(--muted); font-size: 12.5px; }
  .sfoot .ok { color: var(--accent-ink); font-size: 13px; font-weight: 600; }
  .sfoot .bad { color: #b91c1c; font-size: 13px; }
  .switch, .f label.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink); margin: 6px 0 0; position: relative; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { display: inline-block; width: 38px; height: 22px; border-radius: 999px; background: #d1d5db; position: relative; transition: background .15s; flex: none; }
  .switch .track .knob { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track .knob { left: 19px; }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent-soft); }
  .chipsin { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px; min-height: 42px; cursor: text; }
  .chipsin .c { background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12.5px; display: inline-flex; gap: 4px; align-items: center; font-weight: 500; }
  .chipsin .c button { border: none; background: transparent; color: inherit; cursor: pointer; font: inherit; font-size: 14px; line-height: 1; padding: 0 5px; border-radius: 999px; opacity: .7; }
  .chipsin .c button:hover { opacity: 1; background: rgba(0,0,0,.08); }
  .chipsin input { border: none; outline: none; flex: 1; min-width: 140px; font: inherit; padding: 4px 2px; background: transparent; }
  .segment { display: inline-flex; border: 1px solid #d1d5db; border-radius: 10px; overflow: hidden; background: #fff; }
  .segment span { padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--muted); border-right: 1px solid #e5e7eb; }
  .segment span:last-child { border-right: none; }
  .segment span.on { background: var(--accent); color: #fff; font-weight: 600; }
  .segment span:hover:not(.on) { background: #f3f4f6; }
  .pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .pcard { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; background: #fff; }
  .pcard:hover { border-color: #9ca3af; }
  .pcard.on { border-color: var(--accent); background: var(--accent-soft); }
  .pcard b { font-size: 14px; }
  .pcard span { color: var(--muted); font-size: 12.5px; }
  .pcard .mark { float: right; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #d1d5db; display: inline-grid; place-items: center; font-size: 11px; color: #fff; }
  .pcard.on .mark { background: var(--accent); border-color: var(--accent); }
  .secret-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .secret-row .set { display: inline-flex; align-items: center; gap: 8px; background: #f3f4f6; border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .secret-row .set code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .secret-row .set .dot { margin: 0; }
  .secret-row input { flex: 1; min-width: 220px; }
  .linkish { color: var(--accent-ink); cursor: pointer; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
  .banner { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; border-radius: 12px; padding: 12px 16px; display: flex; gap: 14px; align-items: center; margin: 0 0 16px; font-size: 13.5px; flex-wrap: wrap; }
  .banner b { color: #7c2d12; }
  .banner .grow { flex: 1; min-width: 240px; }
  .srcrow { display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
  .srcrow:first-of-type { border-top: none; }

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// Every view the server sends carries an ETag; asking again with it costs a
// 304 and no parsing when nothing changed, which is what makes a tab switch
// instant while the loop is writing the state file every few seconds.
const etags = {};
async function getJson(url) {
  const headers = {};
  if (etags[url]) headers["If-None-Match"] = etags[url];
  const r = await fetch(url, { cache: "no-store", headers });
  if (r.status === 304) return { unchanged: true };
  const et = r.headers.get("ETag");
  if (et) etags[url] = et;
  return { unchanged: false, json: await r.json() };
}

const STATUS = {
  applied: ["Applied", "ok"],
  needs_review: ["Needs review", "warn"],
  blocked: ["Blocked", "bad"],
  ready_not_submitted: ["Ready (dry run)", "info"],
  awaiting_approval: ["Awaiting your approval", "warn"],
  by_hand: ["In your hands", "info"],
  needs_login: ["Needs login", "warn"],
  error: ["Error", "bad"],
  fit_rejected: ["Judges said no", "muted"],
  skipped: ["Skipped", "muted"],
  tailored_only: ["Tailored only", "muted"],
};
const ORDER = Object.keys(STATUS);

function Badge({ status }) {
  const [label, tone] = STATUS[status] || [status, "muted"];
  return <span className={"badge " + tone}>{label}</span>;
}

function fmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function fmtPosted(ts) {
  return ts ? new Date(ts * 1000).toLocaleDateString([], { month: "short", day: "numeric" }) : "";
}

// "hiring manager 90/100 pass | screener 95/100 pass (revised ×1)"
function parseFit(fit) {
  const clean = (fit || "").replace(/\s*\(revised[^)]*\)\s*$/, "");
  return clean.split("|").map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/^(.*?)\s+(\d+)\/100\s+(\S+)$/);
    return m ? { who: m[1], score: +m[2], verdict: m[3] } : { who: s, score: null, verdict: "" };
  });
}
function revisedTag(fit) {
  const m = (fit || "").match(/\(revised[^)]*\)/);
  return m ? m[0] : "";
}

function Judges({ fit }) {
  const js = parseFit(fit);
  if (!js.length) return <span className="none">not judged (stopped before the resume was made)</span>;
  return (
    <div className="judges">
      {js.map((j, i) => (
        <div className="judge" key={i}>
          <div className="score">{j.score === null ? "—" : j.score}<span style={{ fontSize: 12, color: "#6b7280" }}> /100</span></div>
          <div className="who">{j.who} · {j.verdict}</div>
        </div>
      ))}
      {revisedTag(fit) ? <div className="judge"><div className="who">résumé {revisedTag(fit).replace(/[()]/g, "")} from the judges' notes</div></div> : null}
    </div>
  );
}

function workerName(w) {
  return w === "fresh" ? "Fresh lane" : "Worker " + (Number(w) + 1);
}

// Colours: one per outcome and one per stage, kept apart from the accent.
const STATUS_COLOR = {
  applied: "#16a34a", by_hand: "#0ea5e9", awaiting_approval: "#f97316", needs_review: "#f59e0b",
  needs_login: "#8b5cf6", blocked: "#ef4444", error: "#b91c1c", fit_rejected: "#94a3b8",
  skipped: "#cbd5e1", tailored_only: "#a3a3a3", ready_not_submitted: "#38bdf8",
};
const STAGE_COLOR = { offer: "#16a34a", interview: "#2563eb", oa: "#7c3aed", rejected: "#ef4444", "no reply yet": "#9ca3af", applied: "#6b7280" };
const STAGE_LABEL = { offer: "Offer", interview: "Interview", oa: "Online assessment", rejected: "Rejected", "no reply yet": "No reply yet", applied: "Confirmed only" };

// A flow diagram: columns of stacked nodes, bands between them whose
// thickness is the count. Drawn by hand — two or three columns is all it is.
function Sankey({ columns, links, height = 300, leftPad = 8, rightPad = 210, gap = 10 }) {
  const width = 640;
  const colX = (i) => leftPad + i * ((width - leftPad - rightPad - 26) / Math.max(1, columns.length - 1));
  const barW = 26;
  // Node slots: each column stacks its nodes with a gap, scaled to the column's own total.
  const slots = {};
  columns.forEach((col, ci) => {
    const total = col.reduce((a, n) => a + n.value, 0) || 1;
    const usable = height - gap * Math.max(0, col.length - 1);
    let y = 0;
    col.forEach(n => {
      const h = Math.max(n.value > 0 ? 2 : 0, usable * n.value / total);
      slots[n.id] = { x: colX(ci), y, h, col: ci, node: n, outY: y, inY: y };
      y += h + (n.value > 0 ? gap : 0);
    });
  });
  const band = (a, b, v) => {
    const s = slots[a], t = slots[b];
    if (!s || !t || !v) return null;
    const sTotal = s.node.value || 1, tTotal = t.node.value || 1;
    const sh = s.h * v / sTotal, th = t.h * v / tTotal;
    const x0 = s.x + barW, x1 = t.x, y0 = s.outY, y1 = t.inY;
    s.outY += sh; t.inY += th;
    const cx = (x0 + x1) / 2;
    return `M${x0},${y0} C${cx},${y0} ${cx},${y1} ${x1},${y1} L${x1},${y1 + th} C${cx},${y1 + th} ${cx},${y0 + sh} ${x0},${y0 + sh} Z`;
  };
  const paths = links.map(l => ({ ...l, d: band(l.from, l.to, l.value) })).filter(p => p.d);
  return (
    <svg viewBox={`0 0 ${width} ${height + 24}`} role="img">
      <g transform="translate(0,12)">
        {paths.map((p, i) => (
          <path key={i} className="band" d={p.d} fill={p.color}>
            <title>{p.title || `${p.value}`}</title>
          </path>
        ))}
        {Object.values(slots).map(s => (
          <g key={s.node.id}>
            <rect x={s.x} y={s.y} width={barW} height={Math.max(s.h, s.node.value > 0 ? 2 : 0)} fill={s.node.color} rx={3}>
              <title>{s.node.label}: {s.node.value}</title>
            </rect>
            {s.col === columns.length - 1 && s.node.value > 0 ? (
              <text className="lbl" x={s.x + barW + 8} y={s.y + Math.max(s.h, 2) / 2} dominantBaseline="middle">
                <tspan className="lbl n">{s.node.value}</tspan> <tspan className="lbl muted">{s.node.label}</tspan>
              </text>
            ) : null}
            {s.col === 0 ? (
              <text className="lbl" x={s.x} y={-2} textAnchor="start">
                <tspan className="lbl n">{s.node.value}</tspan> <tspan className="lbl muted">{s.node.label}</tspan>
              </text>
            ) : null}
            {s.col > 0 && s.col < columns.length - 1 && s.h > 14 ? (
              <text className="lbl" x={s.x + barW / 2} y={s.y - 3} textAnchor="middle" fontSize="11">{s.node.label}</text>
            ) : null}
          </g>
        ))}
      </g>
    </svg>
  );
}

function Flows({ flows }) {
  const [view, setView] = useState("two");
  if (!flows || flows.error) return <div className="empty">results tracker: {flows?.error || "no data yet"} — run `resume-tailor mail scan`</div>;
  const st = flows.attempts.by_status || {};
  const statusNodes = ORDER.filter(s => st[s]).map(s => ({ id: "s:" + s, label: STATUS[s][0], value: st[s], color: STATUS_COLOR[s] || "#9ca3af" }));
  const attempts = [[{ id: "all", label: "attempts", value: flows.attempts.total, color: "#374151" }], statusNodes];
  const attemptLinks = statusNodes.map(n => ({ from: "all", to: n.id, value: n.value, color: n.color, title: `${n.label}: ${n.value}` }));
  const sg = flows.applied.by_stage || {};
  const stageOrder = ["offer", "interview", "oa", "no reply yet", "rejected"];
  const stageNodes = stageOrder.filter(s => sg[s]).map(s => ({ id: "g:" + s, label: STAGE_LABEL[s], value: sg[s], color: STAGE_COLOR[s] }));
  const applied = [[{ id: "ap", label: "companies applied to", value: flows.applied.total, color: "#16a34a" }], stageNodes];
  const appliedLinks = stageNodes.map(n => ({ from: "ap", to: n.id, value: n.value, color: n.color, title: `${n.label}: ${n.value}` }));
  // The chained view: attempts fan out by outcome, and the applied band carries on into what the inbox says.
  const chainCols = [attempts[0], statusNodes.map(n => ({ ...n, id: "c" + n.id })), stageNodes.map(n => ({ ...n, id: "c" + n.id }))];
  const appliedCount = (st.applied || 0) + (st.by_hand || 0);
  const chainLinks = [
    ...statusNodes.map(n => ({ from: "all", to: "c" + n.id, value: n.value, color: n.color, title: `${n.label}: ${n.value}` })),
    ...stageNodes.map(n => ({ from: "cs:applied", to: "c" + n.id, value: Math.round(n.value * (st.applied || 0) / Math.max(1, flows.applied.total)), color: n.color, title: `${n.label}: ${n.value} companies` })),
  ];
  return (
    <div>
      <div className="flow-toggle">
        <span className={"chip " + (view === "two" ? "active" : "")} onClick={() => setView("two")}>Two flows</span>
        <span className={"chip " + (view === "chain" ? "active" : "")} onClick={() => setView("chain")}>One chained flow</span>
        <span className="watch" style={{ marginLeft: "auto" }}>{flows.scanned_at ? "inbox scanned " + new Date(flows.scanned_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "inbox not scanned yet"}</span>
      </div>
      {view === "two" ? (
        <div className="flows">
          <div className="flow">
            <h3>Every attempt, by outcome</h3>
            <div className="sub">{flows.attempts.total} postings the loop worked on, and where each ended up</div>
            <Sankey columns={attempts} links={attemptLinks} height={Math.max(220, statusNodes.length * 34)} />
          </div>
          <div className="flow">
            <h3>Applied, by what the inbox says</h3>
            <div className="sub">{flows.applied.total} companies with an application in; stages read from your e-mail</div>
            <Sankey columns={applied} links={appliedLinks} height={Math.max(220, stageNodes.length * 44)} />
          </div>
        </div>
      ) : (
        <div className="flows" style={{ gridTemplateColumns: "1fr" }}>
          <div className="flow">
            <h3>From every attempt to every reply</h3>
            <div className="sub">the applied band carries on into the inbox stages ({appliedCount} applied postings across {flows.applied.total} companies)</div>
            <Sankey columns={chainCols} links={chainLinks} height={Math.max(260, statusNodes.length * 34)} rightPad={200} />
          </div>
        </div>
      )}
      {flows.companies?.filter(c => c.stage && c.stage !== "applied").length ? (
        <div className="card" style={{ marginTop: 0 }}>
          <h3>Where something happened</h3>
          <table className="stages">
            <thead><tr><th>Company</th><th>Stage</th><th>Last mail</th><th>Dates mentioned</th></tr></thead>
            <tbody>
              {flows.companies.filter(c => c.stage && c.stage !== "applied").map(c => (
                <tr key={c.key}>
                  <td>{c.company}</td>
                  <td><span className="stage-pill" style={{ background: STAGE_COLOR[c.stage] || "#6b7280" }}>{STAGE_LABEL[c.stage] || c.stage}</span></td>
                  <td>{c.last ? fmtWhen(c.last) : ""}</td>
                  <td>{(c.dates || []).slice(0, 3).join("; ")}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ) : null}
    </div>
  );
}

// One card per process the supervisor runs: what it is doing this minute,
// its last outcomes, and the last lines it wrote to the log.
function Workers({ data, onPick, reload }) {
  const w = data?.watch || {};
  const procs = w.processes || [];
  const nowBy = {};
  for (const n of data?.workers_now || []) nowBy[String(n.worker ?? "")] = n;
  const apps = data?.applications || [];
  if (!procs.length) return <div className="empty">{loopRunning(w) ? "the supervisor is up; the workers follow in a moment" : "no workers are running"}<div style={{ marginTop: 14 }}><LoopControls running={loopRunning(w)} onDone={reload} /></div></div>;
  return (
    <div>
      <div className="workers-head">
        <h3>Where each worker is</h3>
        <span className="watch">{w.label}{data?.pool && data.pool.new != null ? ` · ${data.pool.new} postings waiting in the pool` : ""} <LoopControls running={loopRunning(w)} onDone={reload} /></span>
      </div>
      <div className="workers">
        {procs.map(p => {
          const key = String(p.worker);
          const now = nowBy[key];
          const recent = apps.filter(a => String(a.worker) === key).slice(0, 4);
          const logs = (w.worker_logs || {})[key === "fresh" ? "fresh" : "w" + key] || [];
          return (
            <div className="worker" key={key}>
              <h4><span className={"dot " + (p.alive ? "on" : "")}></span>{workerName(key)} <small>{p.alive ? "pid " + p.pid : "down"}{key === "fresh" ? " · every source, every 5 min" : ""}</small></h4>
              {now && now.stage && now.stage !== "idle"
                ? <div className="stage"><b>{now.company || "?"}</b>{now.role ? " — " + now.role : ""}<br />{now.stage} since {new Date(now.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</div>
                : <div className="stage idle">{p.alive ? (key === "fresh" ? "watching the sources; nothing new since the last poll" : "idle between passes (next look within 10 min)") : "not running"}</div>}
              {recent.length ? (
                <ul>
                  {recent.map(a => (
                    <li key={a.id} onClick={() => onPick(a.id)} style={{ cursor: "pointer" }}>
                      <span>{a.company || "?"}{a.role ? " — " + a.role : ""}</span>
                      <span className="t"><Badge status={a.status} /> {a.when ? new Date(a.when).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : ""}</span>
                    </li>
                  ))}
                </ul>
              ) : null}
              {logs.length ? <pre>{logs.join("\n")}</pre> : null}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Header({ data, err, reload }) {
  const w = data?.watch || {};
  const busy = (data?.workers_now || []).filter(n => n.stage && n.stage !== "idle").length;
  const procs = (w.processes || []).filter(p => p.alive).length;
  return (
    <header>
      <h1>resume-tailor</h1>
      <span className="watch">
        <span className={"dot " + (w.running || w.pass_running ? "on" : "")}></span>
        <b>{w.label || (w.running ? "loop running" : "loop stopped")}</b>
        {data?.pool && data.pool.new != null ? <span className="muted"> · {data.pool.new} new postings waiting in the pool ({data.pool.cached} discovered)</span> : null}
        {procs ? <span> · <b>{busy} of {procs}</b> busy right now</span> : <span> · idle</span>}
        {data ? <span> · refreshed {new Date(data.generated_at).toLocaleTimeString()}</span> : null}
        {err ? <span className="err"> · {err}</span> : null}
      </span>
      {data ? <LoopControls running={loopRunning(w)} onDone={reload} /> : null}
    </header>
  );
}

function Tabs({ tab, setTab, data }) {
  const total = Object.values(data?.counts || {}).reduce((a, b) => a + b, 0);
  const procs = ((data?.watch || {}).processes || []).filter(p => p.alive).length;
  const items = [["applications", "Applications", total], ["calendar", "Calendar", null], ["workers", "Workers", procs], ["files", "Files", null], ["settings", "Settings", null]];
  return (
    <div className="tabs">
      {items.map(([id, label, n]) => (
        <span key={id} className={"tab" + (tab === id ? " active" : "")} onClick={() => setTab(id)}>
          {label}{n != null ? <small>{n}</small> : null}
        </span>
      ))}
    </div>
  );
}

function AppsToolbar({ data, filter, setFilter, q, setQ }) {
  const counts = data?.counts || {};
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  return (
    <div className="toolbar">
      <div className="chips">
        <span className={"chip " + (filter === "all" ? "active" : "")} onClick={() => setFilter("all")}>All<small>{total}</small></span>
        {ORDER.filter(s => counts[s]).map(s => (
          <span key={s} className={"chip " + (filter === s ? "active" : "")} onClick={() => setFilter(s)}>
            {STATUS[s][0]}<small>{counts[s]}</small>
          </span>
        ))}
      </div>
      <input className="search" placeholder="Search company or role" value={q} onChange={e => setQ(e.target.value)} />
    </div>
  );
}

function FilesTab({ onOpen }) {
  const [files, setFiles] = useState(null);
  const [err, setErr] = useState(null);
  const [q, setQ] = useState("");
  const [pick, setPick] = useState(null);
  const [secret, setSecret] = useState(null);   // null = hidden; otherwise the revealed record
  const [busy, setBusy] = useState(false);
  const [hostQ, setHostQ] = useState("");
  useEffect(() => {
    let alive = true;
    const load = async () => {
      try {
        const { unchanged, json: j } = await getJson("/api/files");
        if (!alive || unchanged) return;
        if (j.error) { setErr(j.error); return; }
        setFiles(j); setErr(null);
      } catch (e) { if (alive) setErr(String(e)); }
    };
    load();
    const t = setInterval(load, 60000);
    return () => { alive = false; clearInterval(t); };
  }, []);
  const reveal = async () => {
    setBusy(true);
    try {
      const r = await fetch("/api/logins/reveal", { cache: "no-store" });
      const j = await r.json();
      setSecret(j.error ? { error: j.error } : j);
    } catch (e) { setSecret({ error: String(e) }); }
    setBusy(false);
  };
  if (err) return <div className="empty">files: {err}</div>;
  if (!files) return <div className="empty">loading…</div>;
  const rows = files.resumes.filter(r => !q || (r.company + " " + r.role + " " + r.folder).toLowerCase().includes(q.toLowerCase()));
  const current = rows.find(r => r.id === pick) || rows[0];
  // The saved-login hosts are hundreds of Workday tenants; a wall of them says
  // nothing. One line of counts by ATS family, and a lookup for one portal.
  const hostFamily = h => /myworkday/.test(h) ? "Workday" : /icims\.com$/.test(h) ? "iCIMS" : /oraclecloud\.com$|taleo\.net$/.test(h) ? "Oracle"
    : /greenhouse\.io$/.test(h) ? "Greenhouse" : /lever\.co$/.test(h) ? "Lever" : /ashbyhq\.com$/.test(h) ? "Ashby" : /applytojob\.com$/.test(h) ? "JazzHR"
    : /successfactors|sapsf\.com$/.test(h) ? "SuccessFactors" : "other";
  const hostGroups = Object.entries(files.logins.hosts.reduce((m, h) => { const k = hostFamily(h); m[k] = (m[k] || 0) + 1; return m; }, {}))
    .sort((a, b) => (a[0] === "other") - (b[0] === "other") || b[1] - a[1]);
  const hostHits = hostQ.trim() ? files.logins.hosts.filter(h => h.includes(hostQ.trim().toLowerCase())) : [];
  return (
    <div>
      <div className="card" style={{ marginTop: 0 }}>
        <h3>Login info <span className="none" style={{ textTransform: "none", letterSpacing: 0 }}>· hidden until you ask</span></h3>
        <div className="secret">
          {secret && !secret.error ? (
            <div>
              <div className="kv">
                <b>account e-mail</b><span><code>{secret.email}</code>{secret.other_emails?.length ? <span className="none"> · older accounts: {secret.other_emails.join(", ")}</span> : null}</span>
                <b>site password</b><span><code>{secret.site_password || "(not set — RESUME_TAILOR_SITE_PASSWORD)"}</code></span>
                <b>mailbox the tool reads</b><span><code>{secret.mailbox_user || "(profile e-mail)"}</code></span>
              </div>
              <div className="none" style={{ marginTop: 8 }}>{secret.note}</div>
              <div style={{ marginTop: 10 }}><button onClick={() => setSecret(null)}>Hide</button></div>
            </div>
          ) : (
            <div>
              <span className="none">The e-mail and the one password the tool uses for every portal account it creates. Nothing is shown until you press the button.</span>
              <div style={{ marginTop: 10 }}>
                <button className="primary" disabled={busy} onClick={reveal}>{busy ? "…" : "Show login info"}</button>
                {secret?.error ? <span className="err">{secret.error}</span> : null}
              </div>
            </div>
          )}
          <div className="none" style={{ marginTop: 12 }}>
            {files.logins.hosts.length} portals hold a saved sign-in ({files.logins.saved_sites} sites with cookies in all)
            {hostGroups.length ? <span> · {hostGroups.map(([k, n]) => `${n} ${k}`).join(" · ")}</span> : null}
          </div>
          <div style={{ marginTop: 8 }}>
            <input className="search" placeholder="Saved sign-in at…? type a company or host" value={hostQ} onChange={e => setHostQ(e.target.value)} />
          </div>
          {hostQ.trim() ? (
            <div className="hosts">
              {hostHits.slice(0, 12).map(h => <span key={h}>{h}</span>)}
              {!hostHits.length ? <span className="none plain">no saved sign-in matches “{hostQ.trim()}”</span> : null}
              {hostHits.length > 12 ? <span className="none plain">+{hostHits.length - 12} more</span> : null}
            </div>
          ) : null}
        </div>
      </div>
      <div className="workers-head">
        <h3>Résumés on disk <span className="none" style={{ textTransform: "none", letterSpacing: 0 }}>· {files.counts.resumes} tailored PDFs, {files.counts.documents} generated documents</span></h3>
        <input className="search" placeholder="Search company, role or folder" value={q} onChange={e => setQ(e.target.value)} />
      </div>
      <div className="files">
        <div className="list">
          {rows.slice(0, 400).map(r => (
            <div key={r.id} className={"row" + (current && current.id === r.id ? " active" : "")} onClick={() => setPick(r.id)}>
              <div className="top"><span className="co">{r.company}</span><Badge status={r.status} /></div>
              <div className="role">{r.role}</div>
              <div className="meta"><span>{fmtWhen(r.when)}</span><span>{r.folder}</span>{r.resume_version ? <span>v{r.resume_version}</span> : null}</div>
              <div className="links" onClick={e => e.stopPropagation()}>
                <a href={r.pdf} target="_blank" rel="noreferrer">open PDF</a>
                {r.documents.map(d => <a key={d.url} href={d.url} target="_blank" rel="noreferrer">{d.name}</a>)}
                <a href="#" onClick={e => { e.preventDefault(); onOpen(r.id); }}>application</a>
              </div>
            </div>
          ))}
          {!rows.length ? <div className="empty">nothing matches</div> : null}
        </div>
        <div>
          {current ? (
            <div>
              <div className="sub" style={{ marginBottom: 8 }}><b>{current.company}</b> · {current.role} · <a href={current.pdf} target="_blank" rel="noreferrer">open in a new tab</a></div>
              <iframe className="pdf" src={current.pdf} title="resume" />
            </div>
          ) : <div className="empty">pick a résumé on the left</div>}
        </div>
      </div>
    </div>
  );
}

function Row({ app, active, onClick }) {
  return (
    <div className={"row " + (active ? "active" : "")} onClick={onClick}>
      <div className="top"><span className="co">{app.company || "?"}</span><Badge status={app.status} /></div>
      <div className="role">{app.role}</div>
      <div className="meta">
        {app.when ? <span>{fmtWhen(app.when)}</span> : <span>earlier</span>}
        {app.fit ? <span>{parseFit(app.fit).map(j => j.score).join(" / ")}</span> : null}
        {app.locations?.length ? <span>{app.locations.slice(0, 2).join("; ")}</span> : null}
        {app.worker !== undefined && app.worker !== "" ? <span>{workerName(String(app.worker))}</span> : null}
      </div>
    </div>
  );
}

function Screenshots({ shots }) {
  const kinds = [["post-submit", "After submit"], ["pre-submit", "Before submit"], ["needs-review", "As left for review"], ["dry-run", "Dry run"]];
  const have = kinds.filter(([k]) => shots && shots[k]);
  if (!have.length) return <span className="none">no screenshot for this attempt</span>;
  return (
    <div className="shots">
      {have.map(([k, cap]) => (
        <div className="shot" key={k}>
          <a href={shots[k]} target="_blank" rel="noreferrer"><img src={shots[k]} alt={cap} /></a>
          <div className="cap">{cap} · open full size</div>
        </div>
      ))}
    </div>
  );
}

function Answers({ answers, status }) {
  if (!answers || !answers.length) {
    return <span className="none">
      {["applied", "needs_review", "ready_not_submitted", "awaiting_approval"].includes(status)
        ? "answers were not recorded for this attempt (it ran before recording existed); the next retry will record them"
        : "no form was filled for this posting"}
    </span>;
  }
  const bySection = [];
  for (const a of answers) {
    const sec = a.section || "";
    let g = bySection.find(x => x.section === sec);
    if (!g) { g = { section: sec, items: [] }; bySection.push(g); }
    g.items.push(a);
  }
  return (
    <table className="answers">
      <thead><tr><th>Question</th><th>Answer given</th><th>Where it came from</th></tr></thead>
      <tbody>
        {bySection.map(g => (
          <React.Fragment key={g.section}>
            {g.section ? <tr className="section-head"><td colSpan={3}>{g.section}</td></tr> : null}
            {g.items.map((a, i) => (
              <tr key={i}>
                <td className="q">{a.question}{a.required ? <span className="req">*</span> : null}
                  {a.options?.length ? <div className="none">{a.options.join(" · ")}</div> : null}</td>
                <td className="a">{a.answer ? a.answer : <span className="none">left blank</span>}
                  {a.reason ? <div className="reason">{a.reason}</div> : null}</td>
                <td className="src">{a.source || (a.answer ? "the page had it" : "")}</td>
              </tr>
            ))}
          </React.Fragment>
        ))}
      </tbody>
    </table>
  );
}

function Actions({ app }) {
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const post = async (url, body) => {
    setBusy(true);
    try {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
      const j = await r.json();
      if (j.error) setMsg("Could not do that: " + j.error);
      else if (url.includes("/review/")) setMsg("Opening in Chrome. The posting appears first; the form is filled in over the next minute or two, longer if the resume has to be made or revised first. Check it, then press Submit yourself; close the window when done. You can open several postings at once.");
      else setMsg("Recorded.");
    } catch (e) { setMsg(String(e)); }
    setBusy(false);
  };
  return (
    <div className="actions">
      {app.reviewing ? <span className="badge info">Chrome window open since {new Date(app.reviewing.since).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span> : null}
      {app.status === "awaiting_approval" ? <button disabled={busy} onClick={() => { if (window.confirm(`Submit the application to ${app.company}?`)) post(`/api/approve/${encodeURIComponent(app.id)}`); }}>Approve and submit</button> : null}
      {["needs_login", "by_hand", "blocked"].includes(app.status) ? <button disabled={busy} onClick={() => post(`/api/login/${encodeURIComponent(app.id)}`)}>Log in here, then let the tool apply</button> : null}
      <button disabled={busy} className={app.status === "awaiting_approval" ? "quiet" : ""} onClick={() => post(`/api/review/${encodeURIComponent(app.id)}`)}>{app.reviewing ? "Open another window" : "Open in Chrome to finish by hand"}</button>
      {app.status !== "applied" ? <button disabled={busy} className="quiet" onClick={() => post(`/api/mark/${encodeURIComponent(app.id)}`, { status: "applied" })}>Mark as applied</button> : null}
      {app.status !== "skipped" ? <button disabled={busy} className="quiet" onClick={() => post(`/api/mark/${encodeURIComponent(app.id)}`, { status: "skipped" })}>Mark as skipped</button> : null}
      {msg ? <div className="msg">{msg}</div> : null}
    </div>
  );
}

function Detail({ app: row }) {
  // The list carries the summary; the answers, mail and addresses of the one
  // open row come from /api/application/<id> when it is opened or changes.
  const [full, setFull] = useState(null);
  useEffect(() => {
    let alive = true;
    fetch(`/api/application/${encodeURIComponent(row.id)}`, { cache: "no-store" })
      .then(r => r.json()).then(j => { if (alive && !j.error) setFull(j); }).catch(() => {});
    return () => { alive = false; };
  }, [row.id, row.when, row.status, row.stage]);
  const app = full && full.id === row.id ? full : row;
  const loading = !(full && full.id === row.id);
  return (
    <div className="detail">
      <h2>{app.company || "?"} <span style={{ fontWeight: 400, color: "#6b7280" }}>· {app.role}</span></h2>
      <div className="sub">
        {app.url ? <a href={app.url} target="_blank" rel="noreferrer">posting</a> : null}
        {app.locations?.length ? <span> · {app.locations.join("; ")}</span> : null}
        {app.date_posted ? <span> · posted {fmtPosted(app.date_posted)}</span> : null}
        {app.when ? <span> · attempted {fmtWhen(app.when)}</span> : null}
      </div>

      <div className="card">
        <h3>Outcome</h3>
        <div className="status-line"><Badge status={app.status} /><p>{app.detail}</p></div>
        <Actions app={app} />
      </div>

      <div className="card">
        <h3>What the inbox says {app.stage ? <span className="stage-pill" style={{ background: STAGE_COLOR[app.stage] || "#6b7280", textTransform: "none", letterSpacing: 0 }}>{STAGE_LABEL[app.stage] || app.stage}</span> : null}</h3>
        {app.mail?.length ? (
          <ul className="mail">
            {app.mail.map(m => (
              <li key={m.uid}>
                <span className="t">{m.when ? fmtWhen(m.when) : ""}</span>
                <span><span className="stage-pill" style={{ background: STAGE_COLOR[m.stage] || "#9ca3af" }}>{STAGE_LABEL[m.stage] || m.stage}</span></span>
                <span>{m.subject}{m.note ? <span className="none"> · {m.note}</span> : null}{m.date ? <span className="none"> · {m.date}</span> : null}</span>
              </li>
            ))}
          </ul>
        ) : <span className="none">{loading ? "loading…" : "no mail from this company matched yet"}</span>}
        {app.addresses?.length ? <div className="sub" style={{ marginTop: 8 }}>recruiting addresses seen: {app.addresses.map(a => a.address).join(", ")}</div> : null}
      </div>

      <div className="card">
        <h3>Judges</h3>
        <Judges fit={app.fit} />
      </div>

      <div className="card">
        <h3>Answers given</h3>
        {loading ? <span className="none">loading…</span> : <Answers answers={app.answers} status={app.status} />}
      </div>

      <div className="card">
        <h3>Resume sent {app.pdf ? <a href={app.pdf} target="_blank" rel="noreferrer" style={{ textTransform: "none", letterSpacing: 0 }}>open PDF</a> : null}</h3>
        {app.pdf ? <iframe className="pdf" src={app.pdf} title="resume" /> : <span className="none">no resume was made for this posting</span>}
      </div>

      <div className="card">
        <h3>Screenshots</h3>
        <Screenshots shots={app.screenshots} />
      </div>
    </div>
  );
}

const KIND_COLOR = { assessment: "#7c3aed", interview: "#2563eb", deadline: "#dc2626", event: "#0891b2", other: "#6b7280" };
const KIND_LABEL = { assessment: "Assessment", interview: "Interview", deadline: "Deadline", event: "Event", other: "Date" };
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const isoDay = (y, m, d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
const fmtDay = iso => new Date(iso + "T12:00:00").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
const fmtTime = iso => (iso && iso.length > 10) ? new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";

function MonthGrid({ title, year, month, today, selected, onPick, render }) {
  const first = new Date(year, month, 1);
  const lead = (first.getDay() + 6) % 7;
  const days = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);
  return (
    <div className="cal">
      <h3>{title}</h3>
      <div className="grid">
        {DOW.map(d => <div key={d} className="dow">{d}</div>)}
        {cells.map((d, i) => {
          if (!d) return <div key={"b" + i} className="cell blank" />;
          const iso = isoDay(year, month, d);
          return (
            <div key={iso} className={"cell" + (iso === today ? " today" : "") + (iso === selected ? " sel" : "")} onClick={() => onPick(iso)}>
              <div className="n">{d}</div>
              {render(iso)}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Calendar({ onOpen }) {
  const [cal, setCal] = useState(null);
  const [err, setErr] = useState(null);
  const [ym, setYm] = useState(() => { const t = new Date(); return [t.getFullYear(), t.getMonth()]; });
  const [day, setDay] = useState(null);
  const [onlyApplied, setOnlyApplied] = useState(true);
  useEffect(() => {
    let alive = true;
    const load = async () => {
      try {
        const { unchanged, json: j } = await getJson("/api/calendar");
        if (!alive || unchanged) return;
        if (j.error) { setErr(j.error); return; }
        setCal(j); setErr(null);
      } catch (e) { if (alive) setErr(String(e)); }
    };
    load();
    const t = setInterval(load, 60000);
    return () => { alive = false; clearInterval(t); };
  }, []);
  if (err) return <div className="empty">calendar: {err}</div>;
  if (!cal) return <div className="empty">loading…</div>;
  const [year, month] = ym;
  const label = new Date(year, month, 1).toLocaleDateString([], { month: "long", year: "numeric" });
  const appsOf = iso => (cal.applied[iso] || []).filter(a => !onlyApplied || a.status === "applied" || a.status === "by_hand");
  const evsOf = iso => cal.deadlines[iso] || [];
  const nav = (
    <div className="nav">
      <button onClick={() => setYm(month === 0 ? [year - 1, 11] : [year, month - 1])}>‹</button>
      <b>{label}</b>
      <button onClick={() => setYm(month === 11 ? [year + 1, 0] : [year, month + 1])}>›</button>
      <button onClick={() => { const t = new Date(); setYm([t.getFullYear(), t.getMonth()]); setDay(cal.today); }}>today</button>
      <span className="watch" style={{ marginLeft: "auto" }}>
        {cal.counts.applied} applied over {Object.keys(cal.applied).length} days · {cal.counts.events} dated events
        {cal.deadlines_scanned_at ? " · inbox read for dates " + new Date(cal.deadlines_scanned_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : " · run `resume-tailor calendar scan` to read the inbox for dates"}
      </span>
    </div>
  );
  const dayApps = day ? appsOf(day) : [];
  const dayEvs = day ? evsOf(day) : [];
  return (
    <div>
      <div className="card" style={{ marginTop: 0 }}>
        <h3>Upcoming</h3>
        {cal.upcoming.length ? (
          <div className="upcoming">
            {cal.upcoming.slice(0, 12).map(ev => (
              <React.Fragment key={ev.uid}>
                <span style={{ cursor: "pointer" }} onClick={() => { const d = ev.date.slice(0, 10); setDay(d); setYm([+d.slice(0, 4), +d.slice(5, 7) - 1]); }}>{ev.date.slice(0, 10)} {fmtTime(ev.date)}</span>
                <span className="k" style={{ background: KIND_COLOR[ev.kind] || KIND_COLOR.other }}>{KIND_LABEL[ev.kind] || ev.kind}</span>
                <span><b>{ev.company}</b> · {ev.what || ev.subject}</span>
              </React.Fragment>
            ))}
          </div>
        ) : <span className="none">nothing dated ahead — run `resume-tailor calendar scan` to read the inbox for deadlines</span>}
      </div>
      <div className="cal" style={{ marginBottom: 12, padding: "10px 16px" }}>
        {nav}
        <div className="toggle">
          <label><input type="checkbox" checked={onlyApplied} onChange={e => setOnlyApplied(e.target.checked)} /> applications only (uncheck for every attempt: held, blocked, review)</label>
        </div>
      </div>
      <div className="calwrap">
        <MonthGrid title="Deadlines and dates, from your inbox" year={year} month={month} today={cal.today} selected={day} onPick={setDay}
          render={iso => evsOf(iso).slice(0, 3).map(ev => (
            <span key={ev.uid} className="pill" style={{ background: KIND_COLOR[ev.kind] || KIND_COLOR.other }} title={ev.company + ": " + (ev.what || ev.subject)}>
              {ev.company.split(" ")[0].slice(0, 12)}{fmtTime(ev.date) ? " " + fmtTime(ev.date) : ""}
            </span>
          )).concat(evsOf(iso).length > 3 ? [<span key="more" className="n">+{evsOf(iso).length - 3}</span>] : [])} />
        <MonthGrid title="Applications, by the day they went out" year={year} month={month} today={cal.today} selected={day} onPick={setDay}
          render={iso => { const n = appsOf(iso).length; return n ? <span className="pill" style={{ background: "#16a34a" }}>{n} sent</span> : null; }} />
      </div>
      {day ? (
        <div className="daypanel">
          <div className="card">
            <h3>{fmtDay(day)} · deadlines and dates</h3>
            {dayEvs.length ? dayEvs.map(ev => (
              <div key={ev.uid} className="evt">
                <div><span className="k pill" style={{ background: KIND_COLOR[ev.kind] || KIND_COLOR.other, margin: 0 }}>{KIND_LABEL[ev.kind] || ev.kind}</span> <b>{ev.company}</b>{fmtTime(ev.date) ? <span className="t"> · {fmtTime(ev.date)}</span> : null}</div>
                <div>{ev.what}</div>
                <div className="t">from the e-mail "{ev.subject}"{ev.received ? ", received " + fmtWhen(ev.received) : ""} · found by {ev.source}</div>
              </div>
            )) : <span className="none">nothing due or scheduled this day</span>}
          </div>
          <div className="card">
            <h3>{fmtDay(day)} · {dayApps.length} application{dayApps.length === 1 ? "" : "s"}</h3>
            {dayApps.length ? dayApps.map(a => (
              <div key={a.id} className="evt app" onClick={() => onOpen(a.id)} title="open this application">
                <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}><span><b>{a.company}</b> · {a.role}</span><Badge status={a.status} /></div>
                <div className="t">{fmtWhen(a.when)}{a.fit ? " · " + a.fit : ""}</div>
                <div className="links" onClick={e => e.stopPropagation()}>
                  {a.url ? <a href={a.url} target="_blank" rel="noreferrer">posting</a> : null}
                  {a.pdf ? <a href={a.pdf} target="_blank" rel="noreferrer">résumé PDF</a> : null}
                  {a.screenshot ? <a href={a.screenshot} target="_blank" rel="noreferrer">screenshot</a> : null}
                </div>
              </div>
            )) : <span className="none">nothing went out this day</span>}
          </div>
        </div>
      ) : <div className="empty" style={{ padding: "24px 0 0" }}>Click a day on either calendar to see what is due and what went out.</div>}
    </div>
  );
}

const ACRONYMS = /\b(us|uk|eu|gpa|sat|act|itar|i140|url|ai|it|sms|usd|edu|imap)\b/gi;
const NICE = { linkedin: "LinkedIn", github: "GitHub", gpa: "GPA" };
const pretty = k => NICE[k] || String(k).replace(/_/g, " ").replace(ACRONYMS, m => m.toUpperCase()).replace(/^./, c => c.toUpperCase());

async function postJson(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
// One save button's state: busy, the last outcome, and a runner that clears it.
function useSave() {
  const [st, setSt] = useState({ busy: false, ok: "", err: "" });
  const run = async (fn, okText) => {
    setSt({ busy: true, ok: "", err: "" });
    try { const res = await fn(); setSt({ busy: false, ok: typeof okText === "function" ? okText(res) : (okText || "Saved"), err: "" }); return res; }
    catch (e) { setSt({ busy: false, ok: "", err: String(e.message || e) }); }
  };
  return [st, run];
}
// The Stop / Start button: the whole loop off (supervisor, every worker, the
// fresh lane) or on again. `onDone` re-reads the page so the header follows at once.
function LoopControls({ running, onDone }) {
  const [st, run] = useSave();
  const after = async (url) => { const r = await postJson(url); if (onDone) onDone(); return r; };
  const doStop = () => {
    if (!window.confirm("Stop applying? Every worker, the fresh lane and the supervisor stop now; an application in progress is abandoned and retried later.")) return;
    run(() => after("/api/settings/stop"), r => r.note || "Stopped");
  };
  const doStart = () => run(() => after("/api/settings/start"), r => r.note || "Started");
  return (
    <span className="loopctl">
      {running
        ? <button className="btn small danger" disabled={st.busy} onClick={doStop}>{st.busy ? "Stopping…" : "Stop"}</button>
        : <button className="btn small" disabled={st.busy} onClick={doStart}>{st.busy ? "Starting…" : "Start"}</button>}
      {st.ok ? <span className="ok">{st.ok}</span> : null}
      {st.err ? <span className="bad">{st.err}</span> : null}
    </span>
  );
}
const loopRunning = w => !!(w && (w.running || w.fresh_running || w.supervisor_running || w.pass_running));

function Field({ label, help, code, wide, children }) {
  return <div className={"f" + (wide ? " wide" : "")}><label>{label}{code ? <code>{code}</code> : null}</label>{children}{help ? <div className="help">{help}</div> : null}</div>;
}
function Text({ value, onChange, placeholder, type, list, mono }) {
  return <input type={type || "text"} value={value == null ? "" : value} onChange={e => onChange(e.target.value)} placeholder={placeholder} list={list} style={mono ? { fontFamily: "ui-monospace, Menlo, monospace" } : undefined} />;
}
function Num({ value, onChange, min }) {
  return <input type="number" min={min} value={value == null || value === "" ? "" : value} onChange={e => onChange(e.target.value === "" ? "" : Number(e.target.value))} />;
}
function Switch({ on, onChange, label }) {
  return <label className="switch"><input type="checkbox" checked={!!on} onChange={e => onChange(e.target.checked)} /><span className="track"><span className="knob" /></span>{label ? <span>{label}</span> : null}</label>;
}
function Lines({ value, onChange, rows, placeholder }) {
  // A list edited as one item per line; blank lines are dropped on save.
  return <textarea rows={rows || Math.max(2, (value || []).length + 1)} value={(value || []).join("\n")} placeholder={placeholder} onChange={e => onChange(e.target.value.split("\n"))} />;
}
function Chips({ items, onChange, placeholder, suggestions }) {
  const [draft, setDraft] = useState("");
  const list = items || [];
  const add = () => { const v = draft.trim().replace(/,$/, ""); if (v && !list.includes(v)) onChange([...list, v]); setDraft(""); };
  const id = useMemo(() => "dl" + Math.random().toString(36).slice(2), []);
  return (
    <div className="chipsin" onClick={e => e.currentTarget.querySelector("input")?.focus()}>
      {list.map((it, i) => <span className="c" key={i}>{String(it)}<button type="button" aria-label="remove" onClick={e => { e.stopPropagation(); onChange(list.filter((_, j) => j !== i)); }}>×</button></span>)}
      <input value={draft} list={suggestions ? id : undefined} placeholder={list.length ? "" : (placeholder || "type, then Enter")}
        onChange={e => setDraft(e.target.value)} onBlur={add}
        onKeyDown={e => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(); } else if (e.key === "Backspace" && !draft && list.length) onChange(list.slice(0, -1)); }} />
      {suggestions ? <datalist id={id}>{suggestions.map(s => <option key={s} value={s} />)}</datalist> : null}
    </div>
  );
}
function YesNo({ value, onChange }) {
  const [custom, setCustom] = useState(!/^(yes|no)$/i.test(String(value || "")));
  if (custom) return <span style={{ display: "flex", gap: 10, alignItems: "center" }}><input type="text" value={value || ""} onChange={e => onChange(e.target.value)} style={{ flex: 1 }} /><span className="customize" onClick={() => { setCustom(false); onChange("Yes"); }}>Yes / No</span></span>;
  return (
    <span style={{ display: "inline-flex", alignItems: "center" }}>
      <span className="segment">
        <span className={/^yes$/i.test(value) ? "on" : ""} onClick={() => onChange("Yes")}>Yes</span>
        <span className={/^no$/i.test(value) ? "on" : ""} onClick={() => onChange("No")}>No</span>
      </span>
      <span className="customize" onClick={() => setCustom(true)}>other wording…</span>
    </span>
  );
}
function SaveBar({ st, onClick, label, note }) {
  return (
    <div className="sfoot">
      <button className="btn" disabled={st.busy} onClick={onClick}>{st.busy ? "Saving…" : (label || "Save changes")}</button>
      {st.ok ? <span className="ok">✓ {st.ok}</span> : null}
      {st.err ? <span className="bad">{st.err}</span> : null}
      {note ? <span className="note">{note}</span> : null}
    </div>
  );
}
const RESTART_NOTE = "Workers read this file when they start — restart them (left rail) for a change to reach the loop.";

// --- AI & keys: the env file ----------------------------------------------------
function SecretField({ f, value, cleared, onChange, onClear }) {
  const [editing, setEditing] = useState(!f.set);
  if (f.set && !editing && !cleared) {
    return <div className="secret-row"><span className="set"><span className="dot on" />set{f.hint ? <span>· ends in <code>{f.hint}</code></span> : null}</span>
      <span className="linkish" onClick={() => setEditing(true)}>Replace</span><span className="linkish" onClick={onClear}>Clear</span></div>;
  }
  if (cleared) return <div className="secret-row"><span className="set">will be cleared on save</span><span className="linkish" onClick={() => { onClear(false); setEditing(false); }}>Keep it</span></div>;
  return <div className="secret-row"><input type="password" autoComplete="off" value={value || ""} placeholder={f.set ? "paste the new value" : "paste it here"} onChange={e => onChange(e.target.value)} />
    {f.set ? <span className="linkish" onClick={() => { setEditing(false); onChange(""); }}>Keep the current one</span> : null}</div>;
}

function AiSection({ env, reload }) {
  const byKey = useMemo(() => Object.fromEntries(env.fields.map(f => [f.key, f])), [env]);
  const [vals, setVals] = useState({});
  const [cleared, setCleared] = useState({});
  const [st, run] = useSave();
  const cur = k => (k in vals ? vals[k] : (byKey[k]?.value || ""));
  const set = (k, v) => setVals(p => ({ ...p, [k]: v }));
  const clear = (k, on = true) => setCleared(p => ({ ...p, [k]: on }));
  const provider = cur("RESUME_TAILOR_PROVIDER") || "anthropic";
  const other = provider === "anthropic" ? "openai" : "anthropic";
  const keyOf = { anthropic: "ANTHROPIC_API_KEY", openai: "OPENAI_API_KEY" };
  const sugg = env.suggestions[provider] || [];
  const save = () => run(async () => {
    const updates = {};
    for (const [k, v] of Object.entries(vals)) if (v !== "" || byKey[k]?.set) updates[k] = v;
    for (const [k, on] of Object.entries(cleared)) if (on) updates[k] = null;
    if (!Object.keys(updates).length) throw new Error("nothing changed");
    await postJson("/api/settings/env", { updates });
    setVals({}); setCleared({}); await reload();
  }, "Saved to " + env.path.replace(/^\/Users\/[^/]+/, "~"));
  const F = (k, wide, type) => { const f = byKey[k]; if (!f) return null; return (
    <Field key={k} label={f.label} code={k} help={f.help} wide={wide}>
      {f.secret ? <SecretField f={f} value={vals[k]} cleared={!!cleared[k]} onChange={v => set(k, v)} onClear={(on = true) => clear(k, on)} />
        : f.kind === "bool01" ? <Switch on={cur(k) === "1"} onChange={on => set(k, on ? "1" : "")} label={cur(k) === "1" ? "Hidden" : "Visible"} />
        : f.kind === "number" ? <Num value={cur(k)} onChange={v => set(k, v === "" ? "" : String(v))} min={1} />
        : <Text value={cur(k)} onChange={v => set(k, v)} list={type === "model" ? "models-" + provider : undefined} placeholder={type === "model" ? "default: " + env.defaults[provider] : (type === "omodel" ? "default: gpt-4o" : "")} mono={type === "model" || type === "omodel"} />}
    </Field>); };
  return (
    <div>
      <h2>AI &amp; keys</h2>
      <p className="lede">Which model family does the work, the key it signs in with, and which model handles each job. Saved to the env file; a shell export still wins over it.</p>
      <div className="scard">
        <h3>Provider</h3>
        <div className="desc">Reads the posting, drafts and audits bullets, judges the fit, answers form questions. Inbox scanning and recruiter search always use OpenAI.</div>
        <div className="pcards">
          {[["anthropic", "Anthropic", "Claude models. Key, or an `ant auth login` profile."], ["openai", "OpenAI", "GPT models. Structured output; reasoning effort on gpt-5 / o-series."]].map(([id, name, sub]) => (
            <div key={id} className={"pcard" + (provider === id ? " on" : "")} onClick={() => set("RESUME_TAILOR_PROVIDER", id)}>
              <b>{name}<span className="mark">{provider === id ? "✓" : ""}</span></b><span>{sub}</span>
            </div>
          ))}
        </div>
        <div className="fgrid" style={{ marginTop: 16 }}>
          {F(keyOf[provider], true)}
          {F(keyOf[other], true)}
        </div>
      </div>
      <div className="scard">
        <h3>Models <span className="pill">{provider}</span></h3>
        <div className="desc">Blank means the provider's default. Any model id your account can use works; the list only suggests.</div>
        <datalist id={"models-" + provider}>{sugg.map(s => <option key={s} value={s} />)}</datalist>
        <div className="fgrid">
          {F("RESUME_TAILOR_MODEL", false, "model")}{F("RESUME_TAILOR_AUDIT_MODEL", false, "model")}{F("RESUME_TAILOR_JUDGE_MODEL", false, "model")}
          {F("RESUME_TAILOR_CONCURRENCY")}
          {F("RESUME_TAILOR_MAIL_MODEL", false, "omodel")}{F("RESUME_TAILOR_SEARCH_MODEL", false, "omodel")}
        </div>
      </div>
      <div className="scard">
        <h3>Mailbox, accounts, browser</h3>
        <div className="desc">The inbox the tool reads for one-time codes and replies; the one password for portal accounts it creates; whether its Chrome windows show.</div>
        <div className="fgrid">
          {F("RESUME_TAILOR_IMAP_USER")}{F("RESUME_TAILOR_IMAP_PASSWORD")}{F("RESUME_TAILOR_IMAP_HOST")}
          {F("RESUME_TAILOR_SITE_PASSWORD")}{F("RESUME_TAILOR_HEADLESS")}
          {env.fields.filter(f => f.group === "other").map(f => F(f.key))}
        </div>
        <SaveBar st={st} onClick={save} note={RESTART_NOTE} />
      </div>
    </div>
  );
}

// --- Job sources and search rules: the `search` block of answers.yaml ------------------
function SourcesSection({ sources, search, setSearch, saveSearch, st }) {
  const [name, setName] = useState(""); const [url, setUrl] = useState("");
  const flags = search.sources || {};
  const toggle = (n, on) => setSearch({ ...search, sources: { ...flags, [n]: on } });
  const extras = (search.extra_sources || []).map(x => Array.isArray(x) ? x : [x.name || x.url, x.url]);
  const setExtras = list => setSearch({ ...search, extra_sources: list });
  const addExtra = () => { const n = name.trim(), u = url.trim(); if (!n || !/^https?:\/\//.test(u)) return; setExtras([...extras, [n, u]]); setName(""); setUrl(""); };
  const on = sources.filter(s => s.builtin ? flags[s.name] !== false : true).length;
  return (
    <div>
      <h2>Job sources</h2>
      <p className="lede">The GitHub internship lists the loop reads every pass. Switch a list off and its postings leave the pool on the next refresh; add your own README-table list below.</p>
      <div className="scard">
        <h3>Lists <span className="pill">{on} of {sources.length} on</span></h3>
        <div className="desc">Counts are from the last fetch. The JSON feed is the main list; the others are README tables merged in (a posting already in the feed keeps that record).</div>
        {sources.map(s => {
          const enabled = s.builtin ? flags[s.name] !== false : true;
          return (
            <div key={s.name} className={"srcrow" + (enabled ? "" : " off")}>
              {s.builtin ? <Switch on={enabled} onChange={v => toggle(s.name, v)} /> : <button className="btn quiet small" onClick={() => setExtras(extras.filter(([n]) => n !== s.name))}>Remove</button>}
              <div className="name">{s.label}<small><a href={s.url} target="_blank" rel="noreferrer">{s.url.replace(/^https?:\/\/(raw\.)?/, "")}</a></small></div>
              <span className="kind">{s.kind === "json" ? "JSON feed" : "README table"}</span>
              <span className="n">{s.count ? s.count.toLocaleString() + " postings" : (enabled ? "not fetched yet" : "off")}</span>
            </div>
          );
        })}
        <div className="addrow">
          <Field label="Name"><Text value={name} onChange={setName} placeholder="my-list" /></Field>
          <Field label="Raw README URL" help="A GitHub list kept as a table: Company | Role | Location | Link. Use the raw.githubusercontent.com address."><Text value={url} onChange={setUrl} placeholder="https://raw.githubusercontent.com/…/README.md" type="url" /></Field>
          <button className="btn quiet" onClick={addExtra} disabled={!name.trim() || !/^https?:\/\//.test(url.trim())}>Add list</button>
        </div>
        <SaveBar st={st} onClick={saveSearch} note={RESTART_NOTE} />
      </div>
    </div>
  );
}

// --- the generic editor: any section of answers.yaml, shape preserved ---------------
function AddKey({ onAdd }) {
  const [k, setK] = useState(""); const [v, setV] = useState("");
  const key = k.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
  return (
    <div className="addkey">
      <input placeholder="new key, e.g. github_profile" value={k} onChange={e => setK(e.target.value)} />
      <input placeholder="its answer" value={v} onChange={e => setV(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && key) { onAdd(key, v); setK(""); setV(""); } }} />
      <button className="btn quiet small" disabled={!key} onClick={() => { onAdd(key, v); setK(""); setV(""); }}>Add field</button>
    </div>
  );
}
function ListOfMaps({ items, onChange }) {
  const blank = () => Object.fromEntries(Object.keys(items[0] || {}).map(k => [k, Array.isArray(items[0][k]) ? [] : ""]));
  return (
    <div className="listmaps">
      {items.map((it, i) => (
        <div className="item" key={i}>
          <span className="linkish rmitem" onClick={() => onChange(items.filter((_, j) => j !== i))}>remove</span>
          <GenericEditor data={it} onChange={d => onChange(items.map((x, j) => j === i ? d : x))} />
        </div>
      ))}
      <div><button className="btn quiet small" onClick={() => onChange([...items, blank()])}>Add another</button></div>
    </div>
  );
}
function ValueEditor({ value, onChange }) {
  if (typeof value === "boolean") return <Switch on={value} onChange={onChange} label={value ? "On" : "Off"} />;
  if (typeof value === "number") return <Num value={value} onChange={onChange} />;
  if (Array.isArray(value)) {
    if (value.every(x => x === null || typeof x !== "object")) return <Chips items={value.map(String)} onChange={onChange} />;
    return <ListOfMaps items={value} onChange={onChange} />;
  }
  if (value && typeof value === "object") return <GenericEditor data={value} onChange={onChange} />;
  const s = value == null ? "" : String(value);
  if (/^(yes|no)$/i.test(s)) return <YesNo value={s} onChange={onChange} />;
  return s.length > 60 ? <textarea rows={2} value={s} onChange={e => onChange(e.target.value)} /> : <input type="text" value={s} onChange={e => onChange(e.target.value)} />;
}
function GenericEditor({ data, onChange, help }) {
  const entries = Object.entries(data || {});
  const remove = k => { const d = { ...data }; delete d[k]; onChange(d); };
  return (
    <div className="gen">
      {entries.map(([k, v]) => {
        const nested = v && typeof v === "object" && !Array.isArray(v) || (Array.isArray(v) && v.some(x => x && typeof x === "object"));
        return (
          <div key={k} className={"gen-row" + (nested ? " nested" : "")}>
            <div className="gen-label"><span>{pretty(k)}</span><code>{k}</code><a className="rm" onClick={() => remove(k)}>remove</a></div>
            <div className="val"><ValueEditor value={v} onChange={nv => onChange({ ...data, [k]: nv })} />{help && help[k] ? <div className="help">{help[k]}</div> : null}</div>
          </div>
        );
      })}
      <AddKey onAdd={(k, v) => onChange({ ...data, [k]: v })} />
    </div>
  );
}
function AnswersSection({ sections, reload }) {
  return (
    <div>
      <h2>Form answers</h2>

      {sections.filter(sec => sec.key !== "search").map(sec => <AnswerCard key={sec.key} sec={sec} reload={reload} />)}
    </div>
  );
}
function AnswerCard({ sec, reload }) {
  const [data, setData] = useState(sec.data);
  const [st, run] = useSave();
  useEffect(() => { setData(sec.data); }, [JSON.stringify(sec.data)]);
  const save = () => run(async () => { await postJson("/api/settings/answers", { section: sec.key, data }); await reload(); }, "Saved");

    <div className="scard">
      <h3>{sec.label} <span className="pill">{Object.keys(data || {}).length} keys</span></h3>
      {sec.help ? <div className="desc">{sec.help}</div> : <div style={{ height: 10 }} />}
      <GenericEditor data={data} onChange={setData} />
      <SaveBar st={st} onClick={save} note={RESTART_NOTE} />
    </div>
  );
}

function readAsBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("could not read the file")); r.readAsDataURL(file); });
}

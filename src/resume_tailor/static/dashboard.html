  const setE = (k, v) => set("education", { ...sk.education, [k]: v });
  const upd = (list, i, patch) => set(list, sk[list].map((x, j) => j === i ? { ...x, ...patch } : x));

function SettingsTab() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [section, setSection] = useState(() => { try { return localStorage.getItem("rt-settings") || "ai"; } catch (e) { return "ai"; } });
  useEffect(() => { try { localStorage.setItem("rt-settings", section); } catch (e) {} }, [section]);
  const [search, setSearch] = useState(null);
  const fileSearch = React.useRef(null);   // the search block as last read, to tell unsaved edits from stale state
  const [searchSt, runSearch] = useSave();
  const [restart, runRestart] = useSave();
  const load = async () => {
    try {
      delete etags["/api/settings"];  // a save just happened, or the tab opened: read it fresh
      const { json: j } = await getJson("/api/settings");
      if (j.error) { setErr(j.error); return; }
      setData(j); setErr(null);
      const fresh = (j.answers.sections.find(s => s.key === "search") || {}).data || {};
      setSearch(prev => (prev === null || JSON.stringify(prev) === fileSearch.current) ? fresh : prev);
      fileSearch.current = JSON.stringify(fresh);
    } catch (e) { setErr(String(e)); }
  };
  useEffect(() => { load(); }, []);
  if (err) return <div className="empty">settings: {err}</div>;
  if (!data || !search) return <div className="empty">loading…</div>;
  const saveSearch = () => runSearch(async () => { await postJson("/api/settings/answers", { section: "search", data: search }); await load(); }, "Saved");
  const doRestart = () => { if (window.confirm("Stop every worker now (an application in progress is abandoned and retried later) and start them again on the saved settings?")) runRestart(() => postJson("/api/settings/restart"), r => r.note || "Restarting"); };
  const w = data.workers;
  return (
    <div className="settings">
      <nav className="snav">
        {SETTINGS_SECTIONS.map(([id, label, sub]) => (
          <div key={id} className={"item" + (section === id ? " active" : "")} onClick={() => setSection(id)}>{SECTION_ICON[id]}<span>{label}<small>{sub}</small></span></div>
        ))}
        <div className="procs">
          <div><b>{w.alive} of {w.workers}</b> worker{w.workers === 1 ? "" : "s"} running{w.fresh ? " + fresh lane" : ""}{w.started ? <div>since {new Date(w.started).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</div> : null}</div>
          {w.stale.length ? <div style={{ color: "#9a3412" }}>Changed since then: {w.stale.join(", ")}</div> : <div>Running on the saved settings.</div>}
          {w.supervisor_pid ? <div>Supervisor on: it relaunches what stops.</div> : null}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <button className={"btn small" + (w.stale.length ? " warn" : " quiet")} disabled={restart.busy} onClick={doRestart}>{restart.busy ? "Restarting…" : "Restart workers"}</button>
            <LoopControls running={!!(w.alive || w.fresh || w.supervisor_pid)} onDone={load} />
          </div>
          {restart.ok ? <div className="ok" style={{ color: "var(--accent-ink)" }}>{restart.ok}</div> : null}
          {restart.err ? <div className="bad" style={{ color: "#b91c1c" }}>{restart.err}</div> : null}
        </div>
      </nav>
      <div className="spage">
        {w.stale.length ? <div className="banner"><span className="grow"><b>Saved, not yet live.</b> {w.stale.join(", ")} changed after the workers started; they keep the old values until they restart.</span><button className="btn warn small" disabled={restart.busy} onClick={doRestart}>Restart workers</button></div> : null}
        <div style={{ display: section === "ai" ? "block" : "none" }}><AiSection env={data.env} reload={load} /></div>
        <div style={{ display: section === "sources" ? "block" : "none" }}><SourcesSection sources={data.sources} search={search} setSearch={setSearch} saveSearch={saveSearch} st={searchSt} /></div>
        <div style={{ display: section === "search" ? "block" : "none" }}><SearchSection search={search} setSearch={setSearch} help={data.answers.search_help} saveSearch={saveSearch} st={searchSt} /></div>
        <div style={{ display: section === "profile" ? "block" : "none" }}><ProfileSection basics={data.basics} reload={load} /></div>
        <div style={{ display: section === "answers" ? "block" : "none" }}><AnswersSection sections={data.answers.sections} reload={load} /></div>
        <div style={{ display: section === "resume" ? "block" : "none" }}><ResumeSection resume={data.resume} reload={load} /></div>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [filter, setFilter] = useState("all");
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(null);
  const [tab, setTab] = useState(() => { try { return localStorage.getItem("rt-tab") || "applications"; } catch (e) { return "applications"; } });
  useEffect(() => { try { localStorage.setItem("rt-tab", tab); } catch (e) {} }, [tab]);

  const [core, setCore] = useState(null);   // /api/index: the list, counts, flows — cached server-side, 304 when unchanged
  const [live, setLive] = useState(null);   // /api/now: what the workers are doing right now — small, every 8 s
  const reloadRef = React.useRef(null);     // the Stop / Start buttons re-read the page through it
  useEffect(() => {
    let alive = true;
    const loadCore = async () => {
      try {
        const { unchanged, json: j } = await getJson("/api/index");
        if (!alive || unchanged) return;
        if (j.error) { setErr(j.error); return; }
        setCore(j); setErr(null);
      } catch (e) { if (alive) setErr(String(e)); }
    };
    const loadLive = async () => {
      try {
        const r = await fetch("/api/now", { cache: "no-store" });
        const j = await r.json();
        if (!alive || j.error) return;
        setLive(j);
      } catch (e) { /* the next tick tries again */ }
    };
    loadCore(); loadLive();
    reloadRef.current = () => { loadCore(); loadLive(); };
    const t1 = setInterval(loadCore, 20000);
    const t2 = setInterval(loadLive, 8000);
    return () => { alive = false; clearInterval(t1); clearInterval(t2); };
  }, []);
  const reload = () => { if (reloadRef.current) reloadRef.current(); };
  useEffect(() => { setData(core ? { ...core, ...(live || {}) } : null); }, [core, live]);

  const apps = useMemo(() => (core?.applications || []).filter(a =>
    (filter === "all" || a.status === filter) &&
    (!q || (a.company + " " + a.role).toLowerCase().includes(q.toLowerCase()))
  ), [core, filter, q]);
  const current = (core?.applications || []).find(a => a.id === sel);
  const open = id => { setSel(id); setTab("applications"); };

  return (
    <div className="app">
      <Header data={data} err={err} reload={reload} />
      <Tabs tab={tab} setTab={setTab} data={data} />
      {tab === "applications" ? <AppsToolbar data={data} filter={filter} setFilter={s => { setFilter(s); setSel(null); }} q={q} setQ={setQ} /> : <div className="toolbar"></div>}
      {tab === "applications" ? (
        <div className="body">
          <aside>
            {apps.map(a => <Row key={a.id} app={a} active={a.id === sel} onClick={() => setSel(a.id)} />)}
            {data && !apps.length ? <div className="empty">nothing here yet</div> : null}
            {!data && !err ? <div className="empty">loading…</div> : null}
          </aside>
          <main>
            {current ? <Detail app={current} /> : (
              <div>
                <Flows flows={data?.flows} />
                <div className="empty" style={{ padding: "30px 0 0" }}>
                  <p>Pick an application on the left for its answers, résumé and screenshots.</p>
                  {data?.watch?.log_tail?.length ? (
                    <details className="log">
                      <summary>whole loop log (last lines)</summary>
                      <pre>{data.watch.log_tail.join("\n")}</pre>
                    </details>
                  ) : null}
                </div>
              </div>
            )}
          </main>
        </div>
      ) : (
        <div className="body single">
          <main>
            {tab === "calendar" ? <Calendar onOpen={open} /> : null}
            {tab === "workers" ? <Workers data={data} onPick={open} reload={reload} /> : null}
            {tab === "files" ? <FilesTab onOpen={open} /> : null}
            {tab === "settings" ? <SettingsTab /> : null}
          </main>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
